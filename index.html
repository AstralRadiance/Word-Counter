<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stellar Summon: Star Rail Styles</title>
<style>
:root{
  --bg:#0b0d18;--panel:#151829;--panel2:#1d2138;--tx:#eef0ff;--mu:#949bc2;
  --ac:#7c8cff;--r3:#4aa3ff;--r4:#b46bff;--r5:#ffc83d;--r6:#ff5a3c;--r7:#ff8a3c;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--bg:#eef0fa;--panel:#fff;--panel2:#f4f6ff;--tx:#1b1e33;--mu:#5d6385;color-scheme:light}
}
*{box-sizing:border-box}html,body{margin:0}
body{
  background:radial-gradient(ellipse at top,#252d6355,transparent 60%),var(--bg);
  color:var(--tx);font:15px system-ui,-apple-system,sans-serif;max-width:960px;margin:auto;padding:14px;min-height:100vh
}
h1{font-size:18px;margin:0;letter-spacing:.4px;background:linear-gradient(90deg,var(--ac),var(--r6));-webkit-background-clip:text;background-clip:text;color:transparent}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.jade{background:var(--panel);padding:6px 14px;border-radius:20px;font-weight:700;border:1px solid #7c8cff44}
.tabs{display:flex;gap:4px;margin-bottom:12px;background:var(--panel);padding:4px;border-radius:12px}
.tabs button.alt{background:transparent;border:0;color:var(--mu)}
button{transition:transform .1s,filter .15s}
button:not(:disabled):hover{filter:brightness(1.12)}
button:not(:disabled):active{transform:scale(.97)}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:14px}
button:disabled{opacity:.4;cursor:default}
button.alt{background:var(--panel2);color:var(--tx);border:1px solid #7c8cff33}
button.on{background:#2fb86a;color:#fff}
button.danger{background:#e5484d;color:#fff}
button.asc{background:linear-gradient(135deg,#ff5a3c,#ffc83d);color:#111;font-weight:800}
button.ult-ready{background:linear-gradient(135deg,#ff4d2e,#ffbe3b);color:#111;font-weight:900;box-shadow:0 0 18px #ff7a2c;animation:pulse 0.8s infinite alternate}
.tabs button{flex:1;border-radius:9px}.tabs button.sel{background:var(--ac);color:#fff}
.title-screen{position:fixed;inset:0;z-index:120;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 25%,#3b2b7a99,#0b0d18 65%,#04050c 100%);cursor:pointer;overflow:hidden}
.title-screen .title-glow{position:absolute;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,#7c8cff55,#ff5a3c22 55%,transparent 75%);animation:pulse 2.2s infinite alternate;pointer-events:none}
.title-screen h2{font-size:clamp(28px,7vw,48px);margin:8px 0 10px;letter-spacing:1.2px;background:linear-gradient(90deg,#8ea2ff,#ffd166,#ff6b57);-webkit-background-clip:text;background-clip:text;color:transparent}
.press-start{margin-top:18px;padding:14px 32px;font-size:16px;letter-spacing:2.5px;font-weight:900;border-radius:999px;background:linear-gradient(135deg,#7c8cff,#ff5a3c);color:#fff;box-shadow:0 0 28px #7c8cff77;animation:pulse 1.3s infinite alternate}
.stage-preview-box{margin-top:12px;background:var(--bg);border:1px solid #7c8cff33;border-radius:12px;padding:10px}
.stage-preview-canvas{display:block;width:100%;height:auto;aspect-ratio:16/7;border-radius:8px;border:1px solid #7c8cff22}
.panel{background:var(--panel);border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid #7c8cff22;box-shadow:0 4px 16px #0003}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{background:var(--bg);color:var(--tx);border:1px solid var(--mu);border-radius:8px;padding:8px 10px}
input{flex:1;min-width:140px}

.card{
  border:2px solid var(--c);border-radius:12px;padding:8px 6px;text-align:center;font-size:12px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 22%,var(--bg)),var(--bg));
  min-width:104px;flex:1 1 104px;max-width:154px;line-height:1.4;position:relative;cursor:pointer
}
.card .portrait-box{width:54px;height:54px;margin:0 auto 4px;border-radius:50%;overflow:hidden;border:2px solid var(--c);background:#090b16;display:grid;place-items:center}
.card .portrait-box svg{width:100%;height:100%;display:block}
.card b{display:block;font-size:12.5px;margin-top:2px}
.card .st{color:var(--c);letter-spacing:1px;font-size:11px}
.card .path-tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:999px;background:#ffffff14;color:var(--mu);margin-top:2px}
.card .asc-badge{position:absolute;top:5px;right:5px;font-size:9px;font-weight:800;padding:1px 5px;border-radius:6px;background:#ff5a3c33;color:#ff8a3c;border:1px solid #ff5a3c77}
.r3{--c:var(--r3)}.r4{--c:var(--r4)}.r5{--c:var(--r5);box-shadow:0 0 10px #ffc83d55}
.r6{--c:var(--r6);box-shadow:0 0 18px #ff5a3c77;animation:pulse 1.1s infinite alternate}
.r7,.ff{--c:var(--r7);box-shadow:0 0 26px #ff5a3c,0 0 6px #fff;animation:pulse 1s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 32px var(--c),0 0 6px #fff}}
.flash{height:90px;display:grid;place-items:center;border-radius:10px;background:radial-gradient(circle,var(--c,#7c8cff),transparent 70%);font-size:28px;animation:pulse 0.4s infinite alternate}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:#2fb86a;transition:width .12s}
.log{font-size:12px;color:var(--mu);min-height:22px;margin-top:8px}
small,.mu{color:var(--mu)}
.pop{animation:cin .42s both}

.hero{
  display:flex;justify-content:space-between;align-items:center;gap:12px;border-radius:16px;padding:16px;
  margin-bottom:12px;background:linear-gradient(135deg,#ff5a3c44,#7c8cff2a),var(--panel);border:1px solid #ff5a3c66
}
.hero h2{margin:2px 0 4px;font-size:24px}
.seven{color:#ff8a3c;font-size:13px;letter-spacing:2px;text-shadow:0 0 10px #ff5a3c}
.orb{width:68px;height:68px;border-radius:50%;overflow:hidden;border:2px solid #ff8a3c;animation:pulse2 1.6s infinite alternate;filter:drop-shadow(0 0 14px #ff5a3c);flex-shrink:0}
@keyframes pulse2{to{transform:scale(1.08) rotate(3deg)}}

.pity{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-bottom:12px;font-size:13px}
.pity .bar{margin:0;height:10px}
.pulls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pulls button{padding:14px;font-size:16px;display:flex;flex-direction:column;gap:2px;align-items:center}
.pulls button small{color:inherit;opacity:.85}
.res{margin-top:12px;justify-content:center}
details.panel summary{cursor:pointer;font-weight:700}
.rt{width:100%;margin-top:8px;border-collapse:collapse}
.rt td{padding:5px 0;border-bottom:1px solid #7c8cff22}
.rt td:last-child{text-align:right;color:var(--mu)}

.syn-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;background:#ff8a3c22;border:1px solid #ff8a3c66;color:#ffd29d}
.syn-strip{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.asc-dd-panel{margin-top:8px;border:1px solid #ffc83d44;border-radius:12px;background:var(--panel2);padding:12px;display:grid;gap:8px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#7c8cff22;color:var(--ac)}

/* Modal Overlay (Starter Trailblazer Choice & Confirmations) */
.modal-backdrop{
  position:fixed;inset:0;z-index:120;background:rgba(5,7,16,.88);backdrop-filter:blur(8px);
  display:grid;place-items:center;padding:16px;animation:fi .25s ease-out
}
.modal-card{
  background:linear-gradient(180deg,#1d2240,#121526);border:2px solid #7c8cff66;border-radius:20px;
  max-width:640px;width:100%;padding:22px;box-shadow:0 20px 60px #000a;text-align:center
}
.starter-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.starter-opt{
  background:var(--panel2);border:2px solid #7c8cff44;border-radius:16px;padding:16px;cursor:pointer;
  transition:transform .15s,border-color .15s,box-shadow .15s
}
.starter-opt:hover{transform:translateY(-3px);border-color:#ffc83d;box-shadow:0 8px 24px #ffc83d33}
.starter-opt .big-avatar{width:96px;height:96px;margin:0 auto 10px;border-radius:50%;overflow:hidden;border:3px solid #ffc83d;background:#080a14}

/* Pull Cinematics */
.cine{
  position:fixed;inset:0;z-index:99;display:grid;place-items:center;
  background:radial-gradient(circle at center,color-mix(in srgb,var(--c) 38%,#090b16),#04050a 78%);
  animation:fi .28s ease-out;cursor:pointer;overflow:hidden;text-align:center;color:#fff;padding:20px
}
.cine .rays{
  position:absolute;width:220vmax;height:220vmax;
  background:repeating-conic-gradient(var(--c) 0 5deg,transparent 5deg 16deg);
  opacity:.2;animation:spin 9s linear infinite
}
.cine .ring{
  position:absolute;width:260px;height:260px;border-radius:50%;
  border:2px solid var(--c);box-shadow:0 0 36px var(--c),inset 0 0 28px var(--c);
  animation:ringPulse 1.4s ease-out infinite
}
.cine .emblem{width:110px;height:110px;margin:0 auto 10px;border-radius:50%;overflow:hidden;border:3px solid var(--c);animation:zoom .65s cubic-bezier(.2,1.2,.4,1) both;box-shadow:0 0 28px var(--c)}
.cine .st{font-size:clamp(20px,5.5vw,38px);letter-spacing:4px;color:var(--c);animation:zoom .65s .1s both;text-shadow:0 0 20px var(--c)}
.cine .nm{font-size:clamp(26px,7vw,48px);font-weight:800;animation:zoom .75s .35s both}
.cine .quote{font-style:italic;font-size:14px;max-width:520px;margin:8px auto 0;color:#fffd;animation:zoom .75s .65s both}
.cine .sub{opacity:.82;font-size:12px;margin-top:8px;animation:zoom .75s .85s both}
.sp{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);animation:fl 2.1s infinite}
@keyframes fi{from{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ringPulse{0%{transform:scale(.65);opacity:.9}100%{transform:scale(1.65);opacity:0}}
@keyframes zoom{from{transform:scale(2.6);opacity:0}}
@keyframes fl{from{transform:translateY(0);opacity:1}to{transform:translateY(-150px);opacity:0}}
@keyframes cin{from{transform:scale(.35) rotate(-6deg);opacity:0}}

/* Battle Arena */
.map-banner{
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--panel2);border:1px solid #7c8cff33;border-radius:12px;padding:8px 12px;margin-bottom:10px
}
.obj-pill{background:#ffc83d22;border:1px solid #ffc83d55;color:#ffd86b;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.arena-wrap{position:relative;border-radius:14px;overflow:hidden;border:2px solid #7c8cff44;background:#080a14;box-shadow:inset 0 0 40px #000}
canvas#arena{display:block;width:100%;height:auto;aspect-ratio:16/10;touch-action:none;cursor:crosshair}
.hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px}
.hud-box{background:var(--panel2);border:1px solid #7c8cff22;border-radius:10px;padding:8px 10px;font-size:12px}
.ctrl-grid{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px}
.dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:4px}
.dpad button{padding:0;font-size:16px;background:var(--panel2);border:1px solid #7c8cff44}
.dpad .blank{visibility:hidden}
.char-strip{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.char-chip{
  display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:10px;
  background:var(--panel2);border:1px solid #7c8cff33;cursor:pointer;font-size:12px;font-weight:600
}
.char-chip.active{border-color:#ffc83d;background:#ffc83d22;box-shadow:0 0 12px #ffc83d33}
.mode-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px;padding:6px 10px;border-radius:10px;background:#ff8a3c18;border:1px solid #ff8a3c44}
.diff-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.diff-card{background:var(--panel2);border:2px solid #7c8cff33;border-radius:12px;padding:10px;cursor:pointer;text-align:left}
.diff-card.sel{border-color:#ffc83d;background:#ffc83d1c}

.char-chip{flex-direction:column;align-items:stretch;gap:4px;min-width:140px;color:inherit}
.chip-top{display:flex;gap:6px;align-items:center;justify-content:space-between}
.hpbar{position:relative;display:block;height:8px;border-radius:5px;background:#05070f;overflow:hidden;border:1px solid #ffffff2a}
.hpfill,.shfill{position:absolute;left:0;display:block;transition:width .15s}
.hpfill{top:0;bottom:0}
.shfill{top:0;height:3px;background:#58b8ff}
.hptxt{font-size:10px;opacity:.85;text-align:left}
.char-chip.fallen{opacity:.45;filter:grayscale(1);cursor:not-allowed}
.reset-btn{padding:6px 12px;font-size:12px}
#syn-pop{position:fixed;z-index:9999;display:none;max-width:260px;background:#0d1124f2;color:#e8ecff;border:1px solid #ff8a3c88;border-radius:10px;padding:10px 12px;font-size:12px;box-shadow:0 8px 30px #000a;pointer-events:none;line-height:1.5}
.syn-badge{cursor:help}

#bf{position:fixed;inset:0;z-index:60;background:#05060f;touch-action:none;overflow:hidden;color:var(--tx);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#bf canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#bf-top{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;padding:8px 10px;background:linear-gradient(#050814ee,#05081400);z-index:3;overflow-x:auto;white-space:nowrap}
.bf-box{background:#0b1022cc;border:1px solid #7c8cff44;border-radius:10px;padding:4px 10px;font-size:12px;flex:0 0 auto}
.bf-box small{opacity:.7;display:block;font-size:10px}
#bf .obj-pill{flex:0 0 auto}
#bf-top button{padding:6px 11px;font-size:12px;flex:0 0 auto}
#bf .char-strip{position:absolute;left:8px;top:58px;flex-direction:column;flex-wrap:nowrap;margin:0;z-index:3;width:176px;gap:5px}
#bf .char-chip{min-width:0;width:100%;background:#0b1022d9;padding:6px 8px}
#bf .char-chip.active{box-shadow:0 0 0 2px #ffd166,0 0 18px #ffd16655}
#bf .mode-bar{position:absolute;left:50%;transform:translateX(-50%);bottom:112px;z-index:3;max-width:92vw;flex-wrap:wrap;justify-content:center;background:#0b1022d9;border-radius:12px}
#bf-stats{position:absolute;left:12px;bottom:12px;z-index:3;width:min(300px,44vw);background:#0b1022d9;border:1px solid #7c8cff44;border-radius:12px;padding:8px 10px;font-size:12px}
#bf-stats .bar{height:12px;background:#05070f;border-radius:7px;overflow:hidden;position:relative;border:1px solid #ffffff22;margin:4px 0}
#bf-hpfill,#bf-shfill{position:absolute;left:0;top:0;bottom:0}
#bf-shfill{background:#58b8ff;height:4px;bottom:auto}
#bf-abil{position:absolute;right:12px;bottom:12px;display:flex;gap:10px;align-items:flex-end;z-index:3}
#bf-abil button{border-radius:50%;width:72px;height:72px;padding:0;font-size:12px;font-weight:800;line-height:1.15;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid #ffffff44}
#bf-abil button small{font-size:10px;opacity:.85;font-weight:600}
#btn-fire{width:88px!important;height:88px!important}
#bf-abil #btn-ult{border-radius:14px;width:116px;height:64px;font-size:11px}
#btn-dash.cd{opacity:.5}
#bf-help{position:absolute;left:50%;transform:translateX(-50%);bottom:6px;z-index:2;font-size:11px;opacity:.75;white-space:nowrap;background:#05081499;padding:3px 10px;border-radius:8px}
#bf-joy{position:absolute;left:34px;bottom:90px;width:130px;height:130px;border-radius:50%;background:#ffffff14;border:2px solid #ffffff44;z-index:4;touch-action:none;display:none}
#bf-knob{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:#ffffff55;border:2px solid #fff9}
body.mobile #bf-joy{display:block}
body.mobile #bf-help{display:none}
body.mobile #bf-stats{bottom:auto;top:58px;left:auto;right:10px;width:170px}
body.mobile #bf .char-strip{width:140px}
body.mobile #bf-abil button{width:60px;height:60px}
body.mobile #btn-fire{width:76px!important;height:76px!important}
body.mobile #bf .mode-bar{bottom:150px}
.log-card{max-height:78vh;overflow:auto;max-width:640px;text-align:left}
.eid-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 9px;margin:4px 0;border:1px solid #7c8cff33;border-radius:10px;background:#7c8cff0d}.eid-row.own{background:#4be89c14;border-color:#4be89c55}.log-card h4{margin:14px 0 4px;color:#ffd166}.log-card li{font-size:12.5px;margin:3px 0;line-height:1.45}

#bf{color:#e8ecff}
#bf .char-chip,#bf .char-chip *{color:#e8ecff}
#bf .pill{background:#ffffff1c;color:#cfd6ff}
#bf .mu,#bf small{color:#9aa6d6}
#bf .mode-bar small{color:#ffd166}
body.mobile #bf .char-chip .pill{display:none}
body.mobile #bf .char-chip{padding:4px 7px;font-size:11px}
body.mobile #bf .char-strip{top:50px;width:128px;gap:3px}
body.mobile #bf .mode-bar{transform:translateX(-50%) scale(.72);transform-origin:bottom center;bottom:84px}
body.mobile #bf-stats{top:50px;width:150px;padding:5px 8px}
body.mobile #bf-top{padding:4px 8px}
body.mobile #bf-joy{left:20px;bottom:24px}
@media (max-height:480px){ #bf-help{display:none} #bf-abil{bottom:8px} }
.planet-grid{display:flex;gap:8px;flex-wrap:wrap}.planet{flex:1 1 120px;max-width:170px;border:1px solid #7c8cff44;border-radius:12px;padding:8px;text-align:center;cursor:pointer;background:#7c8cff0d}.planet.sel{border-color:#ffd166;box-shadow:0 0 0 2px #ffd16666}.planet.lock{opacity:.5}.planet .bar{height:6px;background:#0002;border-radius:4px;overflow:hidden}.planet .bar i{display:block;height:100%;background:#4be89c}
.stage-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;margin:4px 0;border:1px solid #7c8cff33;border-radius:10px}.stage-row.done{background:#4be89c14;border-color:#4be89c55}.stage-row.lock{opacity:.5}
</style>
</head>
<body>
<div class="top">
  <h1>✦ Stellar Summon: Star Rail Styles</h1>
  <div class="jade">✦ <span id="jade"></span> Stellar Jade</div>
  <button type="button" id="btn-log" class="alt reset-btn">📜 Update Log</button>
  <button type="button" id="btn-reset" class="danger reset-btn">⟲ Reset All Progress</button>
</div>
<div class="tabs" id="main-tabs">
  <button data-t="b" class="sel">Enter Battle</button>
  <button data-t="s" class="alt">Summon</button>
  <button data-t="r" class="alt">Styles &amp; Ascend</button>
</div>
<div id="app"></div>
<div id="modal-root"></div>
<div id="title-overlay" class="title-screen" role="button" tabindex="0" aria-label="Press to Start">
  <div class="title-glow"></div>
  <div style="position:relative;z-index:2;max-width:560px">
    <div style="font-size:44px;filter:drop-shadow(0 0 18px #7c8cff)">✦ 🚂 ✦</div>
    <small style="letter-spacing:2.5px;text-transform:uppercase">Astral Express Resonance Archive</small>
    <h2>Stellar Summon: Star Rail Styles</h2>
    <p class="mu" style="margin:0 auto;max-width:460px;line-height:1.5">Summon 3★–7★ styles, ascend paths and modes, trigger meta synergies, and conquer 27 huge maps with devastating boss fights every 10 stages.</p>
    <button type="button" id="btn-press-start" class="press-start">PRESS TO START</button>
  </div>
</div>

<script>
const ELS = {F:"🔥", I:"❄️", W:"🌪️", L:"⚡", P:"⚔️", Q:"🔮", M:"✨"};
const EL_COLORS = {F:"#ff6b3d", I:"#6ad5ff", W:"#56f2c2", L:"#b97aff", P:"#ffd166", Q:"#ff66c4", M:"#8cf0ff"};

const PATH_INFO = {
  Destruction: {icon:"💥", desc:"Cleaving arcs & explosive shockwaves"},
  Hunt:        {icon:"🎯", desc:"High-velocity piercing bolts & rapid volleys"},
  Erudition:   {icon:"🌀", desc:"Multi-target ricochets & orbital AoE bursts"},
  Harmony:     {icon:"🎶", desc:"Homing resonance orbs & team speed/aura buffs"},
  Nihility:    {icon:"🌑", desc:"Void lances, DEF shred & lingering DoT hazards"},

  const list = teamIds || S.team;

function getTeamBuffTotals(teamIds = S.team){
  const syList = getActiveSynergies(teamIds);
  const tot = { breakEff: 0, superBreak: 0, spdPct: 0, healPct: 0, dmgPct: 0, dotMult: 1, ultGain: 1, critMult: 1 };
  for(const s of syList){
    if(s.bonus.breakEff) tot.breakEff += s.bonus.breakEff;
    if(s.bonus.superBreak) tot.superBreak += s.bonus.superBreak;
    if(s.bonus.spdPct) tot.spdPct += s.bonus.spdPct;
    if(s.bonus.healPct) tot.healPct += s.bonus.healPct;
    if(s.bonus.dmgPct) tot.dmgPct += s.bonus.dmgPct;
    if(s.bonus.dotMult) tot.dotMult = Math.max(tot.dotMult, s.bonus.dotMult);
    if(s.bonus.ultGain) tot.ultGain = Math.max(tot.ultGain, s.bonus.ultGain);
    if(s.bonus.critMult) tot.critMult = Math.max(tot.critMult, s.bonus.critMult);
  }
  if(typeof G !== "undefined" && G && G.tempBuff && G.tempBuff.t > 0){ tot.dmgPct += G.tempBuff.dmg || 0; tot.spdPct += G.tempBuff.spd || 0; tot.ultGain *= G.tempBuff.ult || 1; }
  return tot;
}

function shadeHex(hex, amt){
  let h = (hex || "#888888").replace("#", "");
  if(h.length === 3) h = h.split("").map(x => x + x).join("");
  const n = parseInt(h, 16);
  const f = v => Math.max(0, Math.min(255, Math.round(v + amt * (amt < 0 ? v : 255 - v))));
  return "#" + [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => f(v).toString(16).padStart(2, "0")).join("");
}

function getGachaPoolByStar(targetStar){
  return ROSTER.filter(c => {
    const id = c[0];
    if(!isGachaObtainable(id)) return false;
    const s = effStar(id);
    return s === targetStar || (targetStar === 3 && s === 1);

function roll(){
  // 8★ 0.001% | 7★ 0.01% | 6★ 0.99% (hard pity 250) | 5★ 4% (guaranteed every 50 pulls) | 4★ 10% | 3★ 84.999%
  const r = Math.random() * 100;
  const pick = star => { const pool = getGachaPoolByStar(star); if(!pool.length) return star > 3 ? pick(star - 1) : "stelle"; return pool[Math.floor(Math.random() * pool.length)][0]; };
  if(r < 0.001){
    S.pity = 0; S.pity5 = 0;
    if(!S.ascendedStar.ff || S.ascendedStar.ff < 8){ S.ascendedStar.ff = 8; }
    S.form.ff = "asc";
    return "ff";
  }
  if(r < 0.011){ S.pity = 0; S.pity5 = 0; return pick(7); }
  if(r < 1.001 || S.pity >= 249){ S.pity = 0; S.pity5 = 0; return pick(6); }
  S.pity++;
  if(r < 5.001 || S.pity5 >= 49){ S.pity5 = 0; return pick(5); }
  S.pity5++;
  if(r < 15.001) return pick(4);
  return pick(3);
}

    const start = performance.now(); let lt = 0, done = false, raf;
    const ease = x => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
    const emit = (dt, t) => {
      if(t < 0.9) return;
      const n = Math.max(1, Math.round(dt * 70 * (rainbow ? 1.6 : 1)));
      for(let i = 0; i < n; i++){
        const k = Math.random();
        if(path === "Destruction") parts.push({ k: "dot", x: rnd(0, W), y: H + 10, vx: rnd(-40, 40), vy: -rnd(180, 520), life: rnd(1, 2.2), r: rnd(2, 5), col: k < 0.5 ? "#ff7a2c" : "#ffd166" });

        else if(path === "Hunt") parts.push({ k: "streak", x: -20, y: rnd(0, H), vx: rnd(1000, 1900), vy: 0, life: rnd(0.5, 1), len: rnd(80, 220), col });

        else if(path === "Harmony") parts.push({ k: "text", x: rnd(0, W), y: H + 10, vx: rnd(-40, 40), vy: -rnd(90, 230), life: rnd(2, 4), ch: ["♪", "♫", "♩", "♬"][i % 4], sz: rnd(20, 46), col: ["#ffd166", "#ff9ff3", "#74b9ff"][i % 3] });
        else if(path === "Preservation") parts.push({ k: "hex", x: rnd(0, W), y: rnd(0, H), vy: rnd(-20, 20), life: rnd(1.2, 2.4), sz: rnd(20, 70), col });
        else if(path === "Abundance") parts.push({ k: "text", x: rnd(0, W), y: -10, vx: rnd(-40, 40), vy: rnd(90, 240), life: rnd(3, 5), ch: ["🌸", "🍃", "✿"][i % 3], sz: rnd(16, 34), col: "#7bed9f" });
        else if(path === "Remembrance") parts.push({ k: "text", x: rnd(0, W), y: rnd(0, H), vx: rnd(-70, 70), vy: rnd(-70, 70), life: rnd(2, 4), ch: "🦋", sz: rnd(16, 38), col });
        else parts.push({ k: "conf", x: rnd(0, W), y: -10, vx: rnd(-60, 60), vy: rnd(140, 340), life: rnd(2, 4), sz: rnd(6, 13), col: ["#ff6b81", "#feca57", "#48dbfb", "#ff9ff3", "#1dd1a1"][i % 5], rot: rnd(0, 6) });
      }
    };
    const finish = () => { if(done) return; done = true; cancelAnimationFrame(raf); ov.remove(); resolve(); };
    ov.onclick = () => { if(performance.now() - start > 900) finish(); };
    const frame = now => {
      const t = (now - start) / 1000, dt = Math.min(0.05, t - lt); lt = t;
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
      let shake = 0; if(t < 1) shake = t * 7; else if(t > 2.15 && t < 2.7) shake = (2.7 - t) * 30;

      const cx = W / 2, cy = H * 0.42, S0 = Math.min(W, H);
      if(t > 0.9 && !bes){
        const a = Math.min(1, (t - 0.9) / 0.8);
        const rg = g.createRadialGradient(cx, cy, 10, cx, cy, Math.max(W, H) * 0.75); rg.addColorStop(0, mainCol + "88"); rg.addColorStop(0.5, mainCol + "22"); rg.addColorStop(1, "#00000000");
        g.globalAlpha = a; g.fillStyle = rg; g.fillRect(0, 0, W, H);
        g.save(); g.translate(cx, cy); g.rotate(t * 0.25);
        for(let k = 0; k < 20; k++){ g.rotate(Math.PI / 10); g.fillStyle = rainbow ? `hsla(${(k * 18 + t * 80) % 360},90%,65%,0.16)` : mainCol + "28"; g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.max(W, H), -26); g.lineTo(Math.max(W, H), 26); g.fill(); }

      if(bes){ if(t > 0.35){ g.save(); g.globalAlpha = Math.min(1, (t - 0.35) / 0.6); bes(g, t, W, H, cx, cy, S0, "bg"); g.restore(); } }
      else {

          const pa = Math.min(1, (t - 0.9) / 0.8);
          for(let k = -3; k <= 3; k++){ const px = cx + k * W * 0.13, ph = H * (0.4 + 0.6 * Math.abs(Math.sin(t * 0.8 + k))); const pg = g.createLinearGradient(0, H - ph, 0, H); pg.addColorStop(0, mainCol + "00"); pg.addColorStop(1, mainCol + "66"); g.globalAlpha = pa * 0.55; g.fillStyle = pg; g.fillRect(px - 14, H - ph, 28, ph); }
          g.globalAlpha = 1;
          if(Math.random() < 0.5){ parts.push({ k: "dot", x: cx + rnd(-W * 0.3, W * 0.3), y: cy + rnd(-H * 0.2, H * 0.3), vx: rnd(-200, 200), vy: rnd(-300, 100), life: rnd(0.6, 1.4), r: rnd(2, 4), col: "#ffffff" }); }
        }
        emit(dt, t);
      }
      for(let i = parts.length - 1; i >= 0; i--){
        const q = parts[i]; q.life -= dt;
        if(q.life <= 0){ parts.splice(i, 1); continue; }
        g.save(); g.globalAlpha = Math.min(1, q.life * 1.2);
        if(q.k === "dot"){ q.x += q.vx * dt; q.y += q.vy * dt; g.fillStyle = q.col; g.shadowColor = q.col; g.shadowBlur = 10; g.beginPath(); g.arc(q.x, q.y, q.r, 0, 6.283); g.fill(); }
        else if(q.k === "orbit"){ q.a += q.sp * dt; g.fillStyle = q.col; g.shadowColor = q.col; g.shadowBlur = 8; g.beginPath(); g.arc(cx + Math.cos(q.a) * q.rad, cy + Math.sin(q.a) * q.rad * 0.7, q.r, 0, 6.283); g.fill(); }
        else if(q.k === "streak"){ q.x += q.vx * dt; g.strokeStyle = q.col; g.lineWidth = 2; g.shadowColor = q.col; g.shadowBlur = 8; g.beginPath(); g.moveTo(q.x - q.len, q.y); g.lineTo(q.x, q.y); g.stroke(); }
        else if(q.k === "spiral"){ q.a += q.sp * dt; q.rad -= 160 * dt; g.fillStyle = q.col; g.shadowColor = q.col; g.shadowBlur = 8; g.beginPath(); g.arc(cx + Math.cos(q.a) * q.rad, cy + Math.sin(q.a) * q.rad, q.r, 0, 6.283); g.fill(); }
        else if(q.k === "text"){ q.x += (q.vx || 0) * dt; q.y += q.vy * dt; g.fillStyle = q.col; g.font = `${q.sz}px system-ui`; g.textAlign = "center"; g.fillText(q.ch, q.x, q.y); }
        else if(q.k === "hex"){ q.y += q.vy * dt; g.strokeStyle = q.col; g.lineWidth = 2; g.beginPath(); for(let h = 0; h < 6; h++){ const aa = h * Math.PI / 3; h ? g.lineTo(q.x + Math.cos(aa) * q.sz, q.y + Math.sin(aa) * q.sz) : g.moveTo(q.x + Math.cos(aa) * q.sz, q.y + Math.sin(aa) * q.sz); } g.closePath(); g.stroke(); }
        else if(q.k === "conf"){ q.x += q.vx * dt; q.y += q.vy * dt; q.rot += dt * 6; g.translate(q.x, q.y); g.rotate(q.rot); g.fillStyle = q.col; g.fillRect(-q.sz / 2, -q.sz / 4, q.sz, q.sz / 2); }
        g.restore();
      }
      if(t > 1.3){
        const pt = Math.min(1, (t - 1.3) / 0.6), sc = ease(pt), size = S0 * 0.4 * sc;
        g.save(); g.translate(cx, cy);
        g.shadowColor = mainCol; g.shadowBlur = 40 + Math.sin(t * 6) * 10;
        g.strokeStyle = mainCol; g.lineWidth = 6; g.beginPath(); g.arc(0, 0, size / 2 + 10, 0, 6.283); g.stroke();
        g.save(); g.beginPath(); g.arc(0, 0, size / 2, 0, 6.283); g.clip();
        if(img.complete && img.naturalWidth) g.drawImage(img, -size / 2, -size / 2, size, size); else { g.fillStyle = "#111"; g.fillRect(-size / 2, -size / 2, size, size); g.font = `${size * 0.5}px system-ui`; g.textAlign = "center"; g.fillText(c[8] || "✦", 0, size * 0.17); }
        g.restore();
        g.lineWidth = 3; g.shadowBlur = 0;
        const ring2 = size / 2 + 26 + Math.sin(t * 3) * 6;
        if(path === "Hunt"){ const k2 = Math.max(0, 1.6 - (t - 1.3) * 0.7); g.strokeStyle = "#ff4757"; g.beginPath(); g.arc(0, 0, ring2 * (1 + k2 * 0.6), 0, 6.283); g.moveTo(-ring2 * 1.5, 0); g.lineTo(ring2 * 1.5, 0); g.moveTo(0, -ring2 * 1.5); g.lineTo(0, ring2 * 1.5); g.stroke(); }
        else if(path === "Preservation" || path === "Erudition"){ g.strokeStyle = mainCol; g.rotate(t * (path === "Erudition" ? 0.8 : 0.2)); g.beginPath(); for(let h = 0; h < 6; h++){ const aa = h * Math.PI / 3; h ? g.lineTo(Math.cos(aa) * ring2, Math.sin(aa) * ring2) : g.moveTo(Math.cos(aa) * ring2, Math.sin(aa) * ring2); } g.closePath(); g.stroke(); if(path === "Erudition"){ g.rotate(0.52); g.beginPath(); for(let h = 0; h < 6; h++){ const aa = h * Math.PI / 3; h ? g.lineTo(Math.cos(aa) * ring2, Math.sin(aa) * ring2) : g.moveTo(Math.cos(aa) * ring2, Math.sin(aa) * ring2); } g.closePath(); g.stroke(); } }
        else if(path === "Destruction"){ g.strokeStyle = "#ff7a2c"; for(let k = 0; k < 3; k++){ const rr = ring2 + ((t * 120 + k * 60) % 180); g.globalAlpha = 1 - (rr - ring2) / 180; g.beginPath(); g.arc(0, 0, rr, 0, 6.283); g.stroke(); } g.globalAlpha = 1; }
        else if(path === "Harmony"){ g.strokeStyle = "#ffd166"; for(let k = 0; k < 4; k++){ const rr = ring2 + ((t * 90 + k * 45) % 180); g.globalAlpha = 1 - (rr - ring2) / 180; g.beginPath(); g.arc(0, 0, rr, 0, 6.283); g.stroke(); } g.globalAlpha = 1; }
        else { g.strokeStyle = mainCol + "bb"; g.setLineDash([12, 10]); g.rotate(-t * 0.5); g.beginPath(); g.arc(0, 0, ring2, 0, 6.283); g.stroke(); }
        g.restore();
      }
      if(bes && t > 0.35){ g.save(); g.globalAlpha = Math.min(1, (t - 0.35) / 0.6); bes(g, t, W, H, cx, cy, S0, "fg"); g.restore(); }
      const pipY = cy + S0 * 0.2 + 36;
      g.textAlign = "center";
      for(let k = 0; k < st; k++){
        const pt0 = (t - (1.9 + k * 0.16)) / 0.25; if(pt0 <= 0) continue;
        const sz = 30 * (pt0 < 1 ? ease(pt0) : 1);
        g.font = `${sz}px system-ui`; g.fillStyle = rainbow ? `hsl(${(k * 40 + t * 120) % 360},90%,65%)` : "#ffd166"; g.shadowColor = g.fillStyle; g.shadowBlur = 14;
        g.fillText("★", cx + (k - (st - 1) / 2) * 38, pipY);
      }
      g.shadowBlur = 0;
      if(t > 2.2){
        const nt = Math.min(1, (t - 2.2) / 0.25), sc = 3 - 2 * nt;
        g.save(); g.translate(cx, pipY + 62); g.scale(sc, sc); g.globalAlpha = nt;
        g.font = `900 ${Math.min(64, W * 0.09)}px system-ui`; g.fillStyle = "#fff"; g.shadowColor = mainCol; g.shadowBlur = 26; g.fillText(c[1], 0, 0); g.restore();
        g.globalAlpha = 1;
      }
      if(t > 2.9){
        const a = Math.min(1, (t - 2.9) / 0.6);
        g.globalAlpha = a; g.font = `700 ${Math.min(24, W * 0.04)}px system-ui`; g.fillStyle = mainCol; g.shadowColor = mainCol; g.shadowBlur = 10;
        g.fillText(`${PATH_INFO[path].icon} ${title}`, cx, pipY + 108); g.globalAlpha = 1; g.shadowBlur = 0;
      }
      if(t > 3.5){
        const chars = Math.min(quote.length, Math.floor((t - 3.5) * 36));
        g.font = `italic ${Math.min(17, W * 0.032)}px system-ui`; g.fillStyle = "#e6eaff"; g.fillText(`“${quote.slice(0, chars)}”`, cx, pipY + 146);
      }
      const dupe = !!lastPullDupe[id];
      g.textAlign = "right"; g.font = "bold 16px system-ui"; g.fillStyle = dupe ? "#8f9bd6" : "#ffd166";
      if(t > 3) g.fillText(dupe ? `Duplicate → +${CP_GAIN[baseStarOf(id)] || 1} Character Points` : "✦ NEW STYLE ✦", W - 22, 70);
      g.restore();
      // flash
      if(t > 0.55 && t < 1.2){ const f = t < 0.9 ? (t - 0.55) / 0.35 : (1.2 - t) / 0.3; g.fillStyle = `rgba(255,255,255,${Math.max(0, Math.min(1, f))})`; g.fillRect(0, 0, W, H); }
      if(t > 2.15 && t < 2.3){ g.fillStyle = `rgba(255,255,255,${(2.3 - t) * 4})`; g.fillRect(0, 0, W, H); }
      // letterbox + skip hint
      const bar = Math.min(1, t / 0.6) * H * 0.07; g.fillStyle = "#000"; g.fillRect(0, 0, W, bar); g.fillRect(0, H - bar, W, bar);
      g.textAlign = "center"; g.font = "12px system-ui"; g.fillStyle = "#ffffff88"; if(t > 1) g.fillText("Tap anywhere to skip", cx, H - bar - 10);
      if(t >= durFinal) finish(); else raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
  });
}

function cineSimple(top, ids){
  return new Promise(resolve => {
    const sevenIds = ids.filter(id => effStar(id) >= 7);
    const sixIds = ids.filter(id => effStar(id) === 6);
    const featuredId = sevenIds.length ? sevenIds[0] : (sixIds.length ? sixIds[0] : ids.slice().sort((a,b)=>effStar(b)-effStar(a))[0]);
    const c = ch(featuredId);
    const st = effStar(featuredId);
    const dur = st >= 7 ? 3200 : st === 6 ? 2500 : top === 5 ? 1600 : 950;

    const d = document.createElement("div");
    d.className = `cine r${Math.min(st, 7)}`;
    const sparks = Array.from({length:24}, () =>
      `<span class="sp" style="left:${Math.random()*100}%;top:${35+Math.random()*65}%;animation-delay:${(Math.random()*2).toFixed(2)}s"></span>`
    ).join("");
    const badge = st >= 7
      ? (st >= 8 ? `Ω ULTIMATE · ★★★★★★★★` : `★★★★★★★ · 7★ APEX OVERDRIVE`)
      : st === 6
      ? `★★★★★★ · 6★ LEGENDARY (${c[4].toUpperCase()})`
      : st === 5
      ? "★★★★★ · 5★ STYLE"
      : "★".repeat(st);
    const quote = c[6] || (st >= 6 ? "An overwhelming cosmic resonance answers your summon!" : "New style registered to your Express archive.");

    d.innerHTML = `
      <div class="rays"></div>
      <div class="ring"></div>
      ${sparks}
      <div style="position:relative;z-index:2">
        <div class="emblem">${renderCharacterSVG(featuredId)}</div>
        <div class="st">${badge}</div>
        <div class="nm">${c[1]}</div>
        <div class="quote">“${quote}”</div>
        <div class="sub">Tap anywhere to continue</div>
      </div>`;
    let done = false;
    const finish = () => {
      if(done) return;
      done = true;
      clearTimeout(tm);
      d.remove();
      resolve();
    };
    const tm = setTimeout(finish, dur);
    d.onclick = finish;
    document.body.appendChild(d);
  });
}

async function cine(top, ids){
  const rares = [...new Set(ids)].filter(id => effStar(id) >= 5).sort((a, b) => effStar(b) - effStar(a));
  if(!rares.length) return cineSimple(top, ids);
  for(const id of rares.slice(0, 3)) await rareCutscene(id);
}

const lastPullDupe = {};
async function summon(n){
  if(busy || S.jade < COST * n) return false;
  busy = true;
  for(const k in lastPullDupe) delete lastPullDupe[k];
  S.jade -= COST * n;
  res = [];
  for(let i = 0; i < n; i++){
    const id = roll();
    const had = !!S.own[id];
    res.push(id);
    lastPullDupe[id] = lastPullDupe[id] || had;
    if(had) addCP(id); else S.own[id] = 1;
  }
  const top = Math.max(...res.map(id => effStar(id)));
  save();
  if(!skip){
    if(top >= 4) await cine(top, res);
    else { flashR = top; draw(); await sleep(420); flashR = 0; }
  }
  busy = false;
  draw();
  return res.some(id => effStar(id) >= 6);
}

async function autoLoop(){
  while(auto){
    const n = Math.min(10, Math.floor(S.jade / COST));
    if(n < 1){ auto = false; msg = "Auto-spin stopped: out of Stellar Jade."; break; }
    const hit = await summon(n);
    if(hit){ auto = false; msg = "6★ / 7★ style pulled! Auto-spin paused."; break; }
    await sleep(skip ? 120 : 850);
  }
  auto = false;
  draw();
}

function redeem(){
  const v = $("#code").value.trim().toUpperCase();
  if(v === ADMIN_CODE){
    if(S.codes.includes(v)) msg = "Code already redeemed.";
    else {
      S.codes.push(v);
      for(const c of ROSTER) S.own[c[0]] = S.own[c[0]] || 1;
      S.unlockedGacha = S.unlockedGacha || {}; S.unlockedGacha.fugue = true;
      S.admin = true; S.jade = 999999999;
      save();
      msg = "🛠️ Redeemed ADMIN code: every character unlocked and Stellar Jade is now unlimited (∞)!";
    }
  } else if(v === SECRET_CODE){
    if(S.codes.includes(v)) msg = "Code already redeemed.";
    else {
      S.codes.push(v);
      S.own.ff = S.own.ff || 1;
      S.jade += 12000;
      save();
      msg = "🔥 Redeemed secret code: Firefly joined your roster and +12000 Stellar Jade granted! Open Styles & Ascend → Firefly (7★ → Ω ULTIMATE).";
    }

    S.jade += CODES[v];

  }
  draw();
}

/* ============================================================================
   ASCENSION EXECUTION (INCLUDING TINGYUN -> FUGUE & 7★ PROMOTIONS)
   ============================================================================ */
function isAscensionCompleted(rule){
  if(rule.type === "transform"){
    return !!(S.unlockedGacha && S.unlockedGacha[rule.toId]);
  }
  if(rule.type === "demote") return !!(S.ascendedStar && S.ascendedStar[rule.fromId] === 1);
  return effStar(rule.fromId) >= rule.targetStar;
}

async function executeAscension(ruleId){
  const rule = ASCENSION_RULES.find(r => r.id === ruleId);
  if(!rule || isAscensionCompleted(rule)) return;
  if(!S.own[rule.fromId]){
    msg = `You must own ${ch(rule.fromId)[1]} first!`;
    return draw();
  }
  if(S.jade < rule.cost){
    msg = `Need ✦ ${rule.cost} Stellar Jade for this ascension.`;
    return draw();
  }
  S.jade -= rule.cost;

  if(rule.type === "transform"){
    // Tingyun -> Fugue (6★) and Fugue enters the 6★ gacha pull pool!
    S.unlockedGacha[rule.toId] = true;
    S.own[rule.toId] = (S.own[rule.toId] || 0) + 1;
    // Also swap Tingyun in active team if present
    const tIdx = S.team.indexOf(rule.fromId);
    if(tIdx >= 0) S.team[tIdx] = rule.toId;
    save();
    msg = `✦ ${ch(rule.fromId)[1]} ascended into 6★ ${ch(rule.toId)[1]}! ${ch(rule.toId)[1]} has now joined the 6★ gacha pool!`;
    draw();
    if(!skip) await cine(6, [rule.toId]);
  } else if(rule.type === "demote"){
    S.ascendedStar[rule.fromId] = 1;
    S.unlockedGacha = S.unlockedGacha || {};
    save();
    msg = `${ch(rule.fromId)[1]} was reduced to 1★. They can now only use a basic attack.`;
    draw();
  } else {
    S.ascendedStar[rule.fromId] = rule.targetStar;
    save();
    msg = rule.targetStar >= 8 ? `Ω ${ch(rule.fromId)[1]} has transcended into her ULTIMATE form! Insane stats, Echo Clones, Phoenix Rebirth, Combustion Aura, Orbital Lance mode & Solar Collapse ult unlocked!` : `✦ ${ch(rule.fromId)[1]} ascended to ${rule.targetStar}★ and joined the ${rule.targetStar}★ gacha pool!`;
    draw();
    if(!skip) await cine(rule.targetStar, [rule.fromId]);
  }
}

function getMapForStage(stage){

function freePoint(obs, w, h, pad, avoid){
  const NG = nogoZones(w, h).slice(2);
  for(let t = 0; t < 120; t++){
    const x = 560 + Math.random() * (w - 900), y = 200 + Math.random() * (h - 400);
    if(obs.some(o => x > o.x - pad && x < o.x + o.w + pad && y > o.y - pad && y < o.y + o.h + pad)) continue;
    if(NG.some(([nx, ny, nr]) => Math.hypot(x - nx, y - ny) < nr)) continue;
    if(avoid && avoid.some(a => Math.hypot(x - a.x, y - a.y) < 560)) continue;
    return { x, y };
  }
  return { x: w * 0.5, y: h * 0.3 };
}
function buildObjective(stage, map, w, h){
  const isBoss = stage % 10 === 0;
  const type = stageObjType(stage);
  const obs = map.obstacles || [];
  const o = { type, title: isBoss ? `STAGE ${stage} CALAMITY BOSS ENCOUNTER` : OBJ_TITLES[type], progress: 0, target: 1, beacon: null, cores: [], items: [], zones: [] };
  if(type === "beacon" && !isBoss){ o.target = 100; o.beacon = { x: w * 0.52, y: h * 0.5, r: 95 }; }
  else if(type === "cores" && !isBoss){
    o.target = 3;
    const hp = 250 + stage * 80;
    o.cores = [[0.72,0.25],[0.78,0.5],[0.72,0.75]].map((q, i) => ({ id: i + 1, x: w * q[0], y: h * q[1], r: 24, hp, maxHp: hp }));
  }
  else if(type === "survive" && !isBoss) o.target = 25;
  else if(type === "collect" && !isBoss){
    o.target = 6;
    const placed = [];
    for(let i = 0; i < 6; i++){ const pt = freePoint(obs, w, h, 60, placed); placed.push(pt); o.items.push({ x: pt.x, y: pt.y, r: 16, got: false }); }
  }
  else if(type === "waves" && !isBoss) o.target = 3;
  else if(type === "elites" && !isBoss) o.target = 3;
  else if(type === "zones" && !isBoss){
    o.target = 100;
    const z1 = freePoint(obs, w, h, 110, []), z2 = freePoint(obs, w, h, 110, [z1]);

function spawnWave(stage, w, h){
  const list = [];
  const isBossStage = stage % 10 === 0;
  const es = scaleStage(stage);
  const count = isBossStage ? 6 : Math.min(6 + Math.floor(es * 0.8), 14);
  const pool = ["stalker","shooter","charger","drone"];
  if(es >= 2) pool.push("warden","cinder_bot","weaver","bomber");
  if(es >= 3) pool.push("mortar");
  if(es >= 4) pool.push("brute","sentinel","healer");
  if(es >= 5) pool.push("leaper","pool");
  if(es >= 6) pool.push("sniper","phantom","splitter");
  if(es >= 7) pool.push("laser","chorus");
  if(es >= 8) pool.push("summoner","cryo_bot","turret");
  let bossId = null;
  if(isBossStage){
    const lst = (curMap && BOSS_BY_THEME[themeOf(curMap)]) || ["doomsday"];
    bossId = CAMP ? PLANETS[CAMP.pi].boss : lst[(Math.floor(stage / 10) - 1) % lst.length];
  }
  for(let i = 0; i < count; i++){
    const isBoss = isBossStage && i === 0;
    const arch = isBoss ? "boss" : pool[(i + stage * 2) % pool.length];
    const angle = (i / count) * Math.PI * 2 + stage * 0.45;
    const dist = isBoss ? 300 : 340 + ((i * 170) % 800);
    const x = Math.max(560, Math.min(w - 140, w * 0.62 + Math.cos(angle) * dist));
    const y = Math.max(140, Math.min(h - 140, h * 0.5 + Math.sin(angle) * dist));
    list.push(makeEnemy(arch, x, y, stage, isBoss, bossId));
  }
  return list;
}

/* ============================================================================
   INSTANT HYPER-PIERCING RAILGUN BEAM (FIREFLY MODE 3 & 7★ RAIL MODES)
   ============================================================================ */
function fireRailgunBeam(x, y, angle, dmg, toughDmg, color, coreColor="#ffffff", width=16){
  if(!G) return;
  const maxLen = 920;
  const endX = x + Math.cos(angle) * maxLen;
  const endY = y + Math.sin(angle) * maxLen;
  G.railBeams.push({ x1: x, y1: y, x2: endX, y2: endY, color, coreColor, width, life: 0.28, maxLife: 0.28 });

  // Recoil particles along the railgun barrel
  addBurst(x + Math.cos(angle)*22, y + Math.sin(angle)*22, color, 12, 160);

  // Instantaneous line-segment hit detection against all enemies & destructible cores
  const dx = endX - x, dy = endY - y;
  const lenSq = dx*dx + dy*dy;

  for(const e of G.enemies){
    if(e.hp <= 0) continue;
    const t = Math.max(0, Math.min(1, ((e.x - x)*dx + (e.y - y)*dy) / lenSq));
    const projX = x + t * dx;
    const projY = y + t * dy;
    const dist = Math.hypot(e.x - projX, e.y - projY);
    if(dist <= e.r + width * 0.85){
      damageEnemy(e, dmg, color, toughDmg);
      addBurst(e.x, e.y, coreColor, 8, 150);
    }
  }

  if(G.objective.type === "cores"){
    for(const core of G.objective.cores){
      if(core.hp <= 0) continue;
      const t = Math.max(0, Math.min(1, ((core.x - x)*dx + (core.y - y)*dy) / lenSq));
      const projX = x + t * dx;
      const projY = y + t * dy;
      if(Math.hypot(core.x - projX, core.y - projY) <= core.r + width * 0.85){
        const d = Math.max(1, Math.round(dmg));
        core.hp = Math.max(0, core.hp - d);
        addFloat(core.x, core.y - core.r - 6, `-${d}`, color);
        if(core.hp === 0){
          G.objective.progress++;
          addBurst(core.x, core.y, "#ffd166", 18, 180);
          addFloat(core.x, core.y - 24, "NODE DESTROYED!", "#ffd166");
        }
      }
    }
  }
}

function skFan(p, base, n, spread, speed, o){
  for(let i = 0; i < n; i++){
    const a = base + (n === 1 ? 0 : (i/(n-1) - 0.5) * spread);
    G.projectiles.push(Object.assign({ x: p.x + Math.cos(a)*20, y: p.y + Math.sin(a)*20, vx: Math.cos(a)*speed, vy: Math.sin(a)*speed, angle: a }, o));
  }
}
function skRing(p, n, speed, o, off=0){
  for(let i = 0; i < n; i++){

    G.projectiles.push(Object.assign({ x: p.x + Math.cos(a)*18, y: p.y + Math.sin(a)*18, vx: Math.cos(a)*speed, vy: Math.sin(a)*speed, angle: a }, o));
  }
}

function applyHitEffects(e, pr){
  if(pr.slow) e.slowT = Math.max(e.slowT || 0, pr.slow);
  if(pr.shred) e.shredT = Math.max(e.shredT || 0, pr.shred);
  if(pr.weak) e.weakT = Math.max(e.weakT || 0, pr.weak);
}
function applyFx(e, fx){
  if(!fx) return;
  if(fx.slow) e.slowT = Math.max(e.slowT || 0, fx.slow);
  if(fx.shred) e.shredT = Math.max(e.shredT || 0, fx.shred);
  if(fx.weak) e.weakT = Math.max(e.weakT || 0, fx.weak);
  if(fx.dot){ e.dotTimer = fx.dot[1]; e.dotDmg = fx.dot[0]; }
}
function blast(x, y, rad, dmg, tough, col, fx){
  addBurst(x, y, col, 14, 170);
  addSlashGraphic(x, y, 0, rad, col, "ring");
  G.shake = Math.max(G.shake || 0, Math.min(9, rad / 28));
  for(const e of G.enemies){
    if(e.hp > 0 && Math.hypot(e.x - x, e.y - y) <= rad + e.r){ damageEnemy(e, dmg, col, tough); applyFx(e, fx); }
  }
}
function shotAt(p, ang, o){
  G.projectiles.push(Object.assign({ x: p.x + Math.cos(ang) * 20, y: p.y + Math.sin(ang) * 20, vx: Math.cos(ang) * (o.spd || 440), vy: Math.sin(ang) * (o.spd || 440), angle: ang, life: 1.2, pierce: 1, toughDmg: 14, r: 9 }, o));
  addBurst(p.x + Math.cos(ang) * 24, p.y + Math.sin(ang) * 24, o.color || "#fff", 2, 90);
}
function huntCrit(p, v){
  if(p.critNext){ p.critNext = false; addFloat(p.x, p.y - 36, "DASH CRIT!", "#ffd166"); return v * 2.2; }
  if(Math.random() < 0.28){ addFloat(p.x, p.y - 36, "CRIT!", "#ffd166"); return v * 1.8; }
  return v;
}
function chainLightning(p, a, A, col){
  let best = null, bd = 1e9;
  for(const e of G.enemies){ if(e.hp <= 0) continue; const d = Math.hypot(e.x - p.aimX, e.y - p.aimY) + Math.hypot(e.x - p.x, e.y - p.y) * 0.3; if(d < bd){ bd = d; best = e; } }
  if(!best) return;
  let cur = best, hit = new Set([best.uid]), from = { x: p.x, y: p.y }, dmg = A;
  for(let hop = 0; hop < 4 && cur; hop++){
    G.railBeams.push({ x1: from.x, y1: from.y, x2: cur.x, y2: cur.y, color: col, coreColor: "#fff", width: 8, life: 0.2, maxLife: 0.2 });
    damageEnemy(cur, dmg, col, 14); cur.slowT = Math.max(cur.slowT || 0, 1.0);
    from = { x: cur.x, y: cur.y }; dmg *= 0.82;
    let nxt = null, nd = 190;
    for(const e of G.enemies){ if(e.hp > 0 && !hit.has(e.uid)){ const d = Math.hypot(e.x - cur.x, e.y - cur.y); if(d < nd){ nd = d; nxt = e; } } }
    if(nxt) hit.add(nxt.uid); cur = nxt;
  }
}

function distSeg(px, py, x1, y1, x2, y2){
  const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy || 1;
  let t = ((px - x1) * dx + (py - y1) * dy) / l2; t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + dx * t), py - (y1 + dy * t));
}

function updateSpecials(dt){
  const p = G.player;
  updateEngine2(dt);
  for(let i = G.queue.length - 1; i >= 0; i--){ const q = G.queue[i]; q.t -= dt; if(q.t <= 0){ G.queue.splice(i, 1); try{ q.fn(); }catch(err){} } }
  G.shake = Math.max(0, (G.shake || 0) - dt * 30);
  if(p.pullT > 0){
    p.pullT -= dt;
    const dx = p.pullX - p.x, dy = p.pullY - p.y, d = Math.hypot(dx, dy) || 1;
    if(d > 60){ p.x += dx / d * 230 * dt; p.y += dy / d * 230 * dt; resolveObstacles(p); }
  }
  for(let i = G.hazards.length - 1; i >= 0; i--){
    const h = G.hazards[i]; h.t += dt;
    if(h.k === "c"){
      if(h.t >= h.delay){
        addBurst(h.x, h.y, h.color, 20, 220); addSlashGraphic(h.x, h.y, 0, h.r, h.color, "ring"); G.shake = Math.max(G.shake, h.r > 200 ? 14 : 7);
        if(p.invuln <= 0 && Math.hypot(p.x - h.x, p.y - h.y) < h.r + p.r * 0.4) applyPlayerHit(h.dmg);
        G.hazards.splice(i, 1);
      }
    } else if(h.k === "b"){
      if(h.t >= h.delay){
        const x2 = h.x + Math.cos(h.ang) * h.len, y2 = h.y + Math.sin(h.ang) * h.len;
        if(h.dmg > 0){
          G.railBeams.push({ x1: h.x, y1: h.y, x2, y2, color: h.color, coreColor: "#ffffff", width: h.w, life: 0.35, maxLife: 0.35 });
          G.shake = Math.max(G.shake, 8);
          if(p.invuln <= 0 && distSeg(p.x, p.y, h.x, h.y, x2, y2) < h.w / 2 + p.r * 0.6) applyPlayerHit(h.dmg);
        }
        G.hazards.splice(i, 1);
      }
    } else if(h.k === "p"){
      if(h.t >= h.delay){
        h.tick -= dt;
        if(h.tick <= 0){ h.tick = 0.5; if(p.invuln <= 0 && Math.hypot(p.x - h.x, p.y - h.y) < h.r + p.r * 0.4) applyPlayerHit(h.dps * 0.45); }
      }
      if(h.t >= h.delay + h.dur) G.hazards.splice(i, 1);
    }
  }
  G.slowT = Math.max(0, (G.slowT || 0) - dt);
  for(let i = G.drops.length - 1; i >= 0; i--){
    const d = G.drops[i];
    if(Math.hypot(p.x - d.x, p.y - d.y) < p.r + d.r + 8){
      S.jade += d.v;
      addFloat(d.x, d.y - 10, `+${d.v} ✦`, d.rare ? "#ffd166" : "#9fb0ff");
      addBurst(d.x, d.y, d.rare ? "#ffd166" : "#7c8cff", 8, 110);
      G.drops.splice(i, 1);
    }
  }
  G.dropTimer -= dt;
  if(G.dropTimer <= 0){ G.dropTimer = 8; if(G.drops.length < 9) spawnDrop(Math.random() < 0.12); }

  if(p.id === "ff" && effStar("ff") >= 8){
    G.auraT -= dt;
    if(G.auraT <= 0){ G.auraT = 0.45; for(const e of G.enemies){ if(e.hp > 0 && Math.hypot(e.x - p.x, e.y - p.y) < 185) damageEnemy(e, p.atk * 0.35, "#ff6b3d", 5); } }
  }
  for(let i = G.sats.length - 1; i >= 0; i--){
    const s = G.sats[i];
    s.life -= dt; s.cd -= dt;
    const ang = G.time * 2.4 + s.k * Math.PI * 2 / s.n;
    s.x = p.x + Math.cos(ang) * 95; s.y = p.y + Math.sin(ang) * 95;
    if(s.cd <= 0){
      s.cd = 0.5;
      let nr = null, bd = 1e9;
      for(const e of G.enemies){ if(e.hp > 0){ const d = Math.hypot(e.x - s.x, e.y - s.y); if(d < bd){ bd = d; nr = e; } } }
      if(nr){ const a = Math.atan2(nr.y - s.y, nr.x - s.x); G.projectiles.push({ x: s.x, y: s.y, vx: Math.cos(a) * 520, vy: Math.sin(a) * 520, r: 9, dmg: p.atk * 0.9, toughDmg: 12, homing: 7, pierce: 2, life: 1.4, color: "#ffbe3b", gfx: "plasma_lance", angle: a }); }
    }
    if(s.life <= 0) G.sats.splice(i, 1);
  }
  for(let i = G.holes.length - 1; i >= 0; i--){
    const hl = G.holes[i];
    hl.t += dt; hl.tick -= dt;
    for(const e of G.enemies){
      if(e.hp <= 0) continue;
      const dx = hl.x - e.x, dy = hl.y - e.y, d = Math.hypot(dx, dy);
      if(d < hl.r && d > 8){ const pull = Math.min(d, 230 * dt * (e.boss ? 0.3 : 1)); e.x += dx / d * pull; e.y += dy / d * pull; }
    }
    if(hl.tick <= 0){ hl.tick = 0.3; for(const e of G.enemies) if(e.hp > 0 && Math.hypot(e.x - hl.x, e.y - hl.y) < hl.r) damageEnemy(e, hl.dmg * 0.18, "#b580ff", 8); }
    if(hl.t >= hl.life){ blast(hl.x, hl.y, hl.r * 1.05, hl.dmg, 70, "#ff6bd6", { slow: 1.5 }); G.holes.splice(i, 1); }
  }
}

function cone(p, a, range, arc, dmg, tough, col, fx, knock){
  addSlashGraphic(p.x + Math.cos(a) * range * 0.45, p.y + Math.sin(a) * range * 0.45, a, range * 0.72, col, "arc");
  for(const e of G.enemies){
    if(e.hp <= 0) continue;
    const dx = e.x - p.x, dy = e.y - p.y, d = Math.hypot(dx, dy) || 1;
    if(d > range + e.r) continue;
    let df = Math.atan2(dy, dx) - a; while(df > Math.PI) df -= 6.283; while(df < -Math.PI) df += 6.283;
    if(Math.abs(df) > arc / 2) continue;
    damageEnemy(e, dmg, col, tough); applyFx(e, fx);
    if(knock && !e.boss){ e.x += dx / d * knock; e.y += dy / d * knock; }
  }
  G.shake = Math.max(G.shake || 0, 3);
}
function lunge(p, a, d){
  for(let k = 0; k < 4; k++) G.ghosts.push({ x: p.x + Math.cos(a) * d * k / 4, y: p.y + Math.sin(a) * d * k / 4, life: 0.3, color: EL_COLORS[ch(p.id)[2]] || "#fff" });
  p.x = Math.max(p.r + 12, Math.min(G.w - p.r - 12, p.x + Math.cos(a) * d)); p.y = Math.max(p.r + 12, Math.min(G.h - p.r - 12, p.y + Math.sin(a) * d)); resolveObstacles(p);
}
function ringAt(x, y, n, spd, o, off){ for(let i = 0; i < n; i++){ const a = (off || 0) + i * Math.PI * 2 / n; G.projectiles.push(Object.assign({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, angle: a, pierce: 1, toughDmg: 10, r: 8, life: 0.8 }, o)); } }
function petAdd(kind, life, cd, dmg, color, icon){
  G.pets = G.pets.filter(x => x.kind !== kind);
  G.pets.push({ kind, life, cd: 0.2, cdMax: cd, dmg, color, icon, x: G.player.x, y: G.player.y, k: G.pets.length });
}
function orbAdd(n, rad, life, dmg, color, spd, fx, tough){
  for(let i = 0; i < n; i++) G.orbiters.push({ ang: i * Math.PI * 2 / n, rad, life, dmg, color, spd, fx, tough: tough || 10, hit: {}, x: 0, y: 0 });
}
function fireAdd(x, y, r, life, dmg, color, fx){ G.fires.push({ x, y, r, life, t: 0, dmg, color, fx, tick: 0.2 }); }
function pt(p, a, d){ return { x: p.x + Math.cos(a) * d, y: p.y + Math.sin(a) * d }; }
function aimTarget(p, maxd){ return nearestEnemy(p.aimX, p.aimY, maxd || 420); }

function dashPass(p){
  const st = effStar(p.id), mult = st >= 8 ? 5 : st >= 7 ? 3.2 : st >= 6 ? 0.7 : 0;
  if(!mult) return;
  const col = EL_COLORS[ch(p.id)[2]] || "#fff";
  for(const e of G.enemies){
    if(e.hp > 0 && !p.dashHits[e.uid] && Math.hypot(e.x - p.x, e.y - p.y) < e.r + 36){ p.dashHits[e.uid] = 1; damageEnemy(e, p.atk * mult, col, 24); addBurst(e.x, e.y, col, 8, 200); }
  }
}
function trailPoints(ox, oy, p, step){ const out = [], d = Math.hypot(p.x - ox, p.y - oy), n = Math.max(1, Math.floor(d / step)); for(let i = 0; i <= n; i++) out.push([ox + (p.x - ox) * i / n, oy + (p.y - oy) * i / n]); return out; }

function dashFinish(p, ox, oy){
  const st = effStar(p.id), fn = DASH_FINISH[p.id];
  if(fn) fn(p, ox, oy, st); else { blast(p.x, p.y, 160, p.atk * 2.0, 30, EL_COLORS[ch(p.id)[2]] || "#fff"); }
}
function doDash(){
  if(!G || G.clearing || G.defeated || G.cutin) return;
  const p = G.player;
  if((p.dashCd || 0) > 0 || (p.dashT || 0) > 0 || effStar(p.id) <= 1) return;
  let dx = p.lastMx || 0, dy = p.lastMy || 0;
  if(keys["KeyW"] || keys["KeyS"] || keys["KeyA"] || keys["KeyD"] || keys["ArrowUp"] || keys["ArrowDown"] || keys["ArrowLeft"] || keys["ArrowRight"] || (G.joy && G.joy.active)){
    dx = ((keys["KeyD"] || keys["ArrowRight"]) ? 1 : 0) - ((keys["KeyA"] || keys["ArrowLeft"]) ? 1 : 0); dy = ((keys["KeyS"] || keys["ArrowDown"]) ? 1 : 0) - ((keys["KeyW"] || keys["ArrowUp"]) ? 1 : 0);
    if(G.joy && G.joy.active){ dx = G.joy.x; dy = G.joy.y; }
  }
  if(!dx && !dy){ const a0 = Math.atan2(p.aimY - p.y, p.aimX - p.x); dx = Math.cos(a0); dy = Math.sin(a0); }
  const m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
  { const st0 = effStar(p.id); p.dashCd = (st0 >= 8 ? 3.5 : st0 >= 7 ? 4.0 : st0 >= 6 ? 4.5 : 5.0) * (eid(p.id) >= 4 ? 0.85 : 1); }
  p.dashHits = {}; p.dashT = 0.17; p.dvx = dx * 1650; p.dvy = dy * 1650; p.invuln = Math.max(p.invuln, 0.42);
  const c = ch(p.id), col = EL_COLORS[c[2]] || "#fff", path = c[4], ox = p.x, oy = p.y;
  addBurst(ox, oy, col, 10, 160);
  if(effStar(p.id) >= 7) qAdd(0.19, () => dashFinish(G.player, ox, oy));
  if(path === "Destruction") qAdd(0.17, () => blast(G.player.x, G.player.y, 120, G.player.atk * 1.1, 20, col));
  else if(path === "Erudition") blast(ox, oy, 130, p.atk * 0.5, 10, col, { slow: 1.6 });
  else if(path === "Hunt"){ p.critNext = true; addFloat(p.x, p.y - 30, "Next shot: CRIT!", "#ffd166"); }
  else if(path === "Nihility") fireAdd(ox, oy, 80, 3, p.atk * 0.25, "#a55eea", { weak: 2, shred: 2 });
  else if(path === "Harmony"){ if(!G.tempBuff) G.tempBuff = { dmg: 0.1, spd: 0.15, ult: 1, t: 3 }; }
  else if(path === "Preservation"){ p.shield = Math.min(p.maxHp * 1.25, p.shield + p.maxHp * 0.06); addFloat(p.x, p.y - 30, "+Shield", "#58b8ff"); }
  else if(path === "Abundance"){ p.hp = Math.min(p.maxHp, p.hp + p.maxHp * 0.04); addFloat(p.x, p.y - 30, "+Heal", "#4be89c"); }
  else if(path === "Remembrance"){ if(G.memosprite) G.memosprite.overdriveTimer = Math.max(G.memosprite.overdriveTimer, 2.5); }
  else if(path === "Elation") qAdd(0.17, () => ringAt(G.player.x, G.player.y, 6, 380, { r: 8, dmg: G.player.atk * 0.8, aoe: 36, bounce: 1, life: 0.9, color: col, gfx: "elation_die" }));
}

function updateEngine2(dt){
  const p = G.player;
  if(G.tempBuff){ G.tempBuff.t -= dt; if(G.tempBuff.t <= 0) G.tempBuff = null; }
  for(let i = G.ghosts.length - 1; i >= 0; i--){ G.ghosts[i].life -= dt; if(G.ghosts[i].life <= 0) G.ghosts.splice(i, 1); }
  for(let i = G.pets.length - 1; i >= 0; i--){
    const pe = G.pets[i]; pe.life -= dt; pe.cd -= dt;
    const aa = G.time * 2 + pe.k * 2.4;
    pe.x += (p.x + Math.cos(aa) * 66 - pe.x) * Math.min(1, dt * 8); pe.y += (p.y + Math.sin(aa) * 66 - pe.y) * Math.min(1, dt * 8);
    if(pe.cd <= 0){
      const t = nearestEnemy(pe.x, pe.y, 650);
      if(t){ pe.cd = pe.cdMax; const ang = Math.atan2(t.y - pe.y, t.x - pe.x); G.projectiles.push({ x: pe.x, y: pe.y, vx: Math.cos(ang) * 520, vy: Math.sin(ang) * 520, r: 8, dmg: pe.dmg, toughDmg: 10, homing: 4, pierce: 1, life: 1.3, color: pe.color, gfx: "plasma_lance", angle: ang }); }
    }
    if(pe.life <= 0) G.pets.splice(i, 1);
  }
  for(let i = G.orbiters.length - 1; i >= 0; i--){
    const o = G.orbiters[i]; o.life -= dt; o.ang += o.spd * dt;
    o.x = p.x + Math.cos(o.ang) * o.rad; o.y = p.y + Math.sin(o.ang) * o.rad;
    for(const e of G.enemies){
      if(e.hp <= 0) continue;
      if(Math.hypot(e.x - o.x, e.y - o.y) < e.r + 16 && (G.time - (o.hit[e.uid] || -9)) > 0.35){ o.hit[e.uid] = G.time; damageEnemy(e, o.dmg, o.color, o.tough); applyFx(e, o.fx); }
    }
    if(o.life <= 0) G.orbiters.splice(i, 1);
  }
  for(let i = G.fires.length - 1; i >= 0; i--){
    const f = G.fires[i]; f.t += dt; f.tick -= dt;
    if(f.tick <= 0){ f.tick = 0.4; for(const e of G.enemies) if(e.hp > 0 && Math.hypot(e.x - f.x, e.y - f.y) < f.r + e.r){ damageEnemy(e, f.dmg, f.color, 4); applyFx(e, f.fx); } }
    if(f.t >= f.life) G.fires.splice(i, 1);
  }
  if(G.mobile){
    const t = nearestEnemy(p.x, p.y, 900);
    if(t){ p.aimX = t.x; p.aimY = t.y; } else if(p.lastMx || p.lastMy){ p.aimX = p.x + (p.lastMx || 0) * 300; p.aimY = p.y + (p.lastMy || 0) * 300; }
  }
}

function syncActiveToTeam(){

function healTeam(activeFrac, othersFrac){

function shieldTeam(amt, othersMult){

  p.shield = Math.min(p.maxHp * 1.25, p.shield + amt);

function damageEnemy(en, dmg, color="#fff", toughDmg=12){
  if(!G || en.hp <= 0) return;
  addBurst(en.x, en.y, color, 4, 150);
  if(Math.random() < 0.35) addSlashGraphic(en.x, en.y, 0, en.r + 12, color, "ring");
  const buffs = getTeamBuffTotals(S.team);
  const diff = DIFFICULTIES[S.difficulty] || DIFFICULTIES.normal;
  const breakMult = 1 + buffs.breakEff;
  let totalDmg = dmg;
  if(en.shredT > 0) totalDmg *= 1.25;
  if(en.arch === "sentinel" && en.brokenTimer <= 0) totalDmg *= 0.6;

  if(en.maxToughness > 0){
    const tHit = toughDmg * breakMult;
    en.toughness = Math.max(0, en.toughness - tHit);
    if(en.toughness === 0 && en.brokenTimer <= 0){
      en.brokenTimer = 3.2;
      const breakBurst = (G.player.atk * 1.45 + S.stage * 25) * (1 + buffs.superBreak);
      totalDmg += breakBurst;
      addFloat(en.x, en.y - en.r - 18, `💥 WEAKNESS BREAK! -${Math.round(breakBurst)}`, "#ffd166");
    } else if(en.brokenTimer > 0 && buffs.superBreak > 0){
      totalDmg += tHit * 2.2 * buffs.superBreak;
    }
  }

  const finalDmg = Math.max(1, Math.round(totalDmg));
  en.hp -= finalDmg;
  en.flash = 0.12;
  gainUltCharge(5);
  addFloat(en.x, en.y - en.r - 4, `-${finalDmg}`, color);
  if(en.hp <= 0){
    addBurst(en.x, en.y, en.boss ? "#ff5a3c" : en.color, en.boss ? 26 : 10, 175);
    gainUltCharge(16);
    const reward = Math.max(1, Math.round(((en.boss ? 40 : 2) + S.stage * 0.5) * diff.rewardMult * (en.elite ? 3 : 1)));
    S.jade += reward;
    addFloat(en.x, en.y - 18, `+${reward} ✦`, "#7c8cff");
    if(en.boss){ G.shake = 20; addBurst(en.x, en.y, en.color, 50, 380); addSlashGraphic(en.x, en.y, 0, 400, en.color, "ring"); const bb = Math.round(60 * diff.rewardMult); S.jade += bb; addFloat(en.x, en.y - 50, `BOSS DEFEATED! +${bb} ✦`, "#ffd166"); G.hazards = []; }
    if(en.arch === "splitter") for(let k = 0; k < 2; k++) G.enemies.push(makeEnemy("drone", en.x + (k ? 22 : -22), en.y, S.stage));
    if(G.player.id === "ff" && effStar("ff") >= 8){ G.player.hp = Math.min(G.player.maxHp, G.player.hp + Math.round(G.player.maxHp * 0.04)); }
  }
}

function resolveObstacles(entity){
  if(!G || !G.map.obstacles || entity.ghost > 0) return;
  for(const ob of G.map.obstacles){
    const closestX = Math.max(ob.x, Math.min(entity.x, ob.x + ob.w));
    const closestY = Math.max(ob.y, Math.min(entity.y, ob.y + ob.h));
    const dx = entity.x - closestX;
    const dy = entity.y - closestY;
    const dist = Math.hypot(dx, dy);
    if(dist < entity.r){
      if(dist === 0) entity.x -= entity.r;
      else {
        const push = entity.r - dist;
        entity.x += (dx / dist) * push;
        entity.y += (dy / dist) * push;
      }
    }
  }
}

function completeStage(){
  if(!G || G.clearing || G.defeated || G.cutin) return;
  const diff = DIFFICULTIES[S.difficulty] || DIFFICULTIES.normal;
  const bonus = Math.round((18 + S.stage * 3) * diff.rewardMult);
  S.jade += bonus;
  syncActiveToTeam();
  const nxt = BATTLE_MAPS[S.stage % BATTLE_MAPS.length];
  G.clearing = { t: 0, dur: 2.6, bonus, from: S.stage, nextName: nxt.name, nextObj: (S.stage + 1) % 10 === 0 ? "Boss Encounter" : OBJ_TITLES[stageObjType(S.stage + 1)] };
  for(const e of G.enemies) addBurst(e.x, e.y, e.color, 10, 160);
  G.enemies = []; G.projectiles = []; G.railBeams = []; G.slashes = [];
  addBurst(G.player.x, G.player.y, "#ffd166", 40, 320);
  addBurst(G.player.x, G.player.y, "#4be89c", 30, 260);
  save();
}
function finishClearing(){
  const carry = {};
  for(const id of S.team){ const t = G.teamHp[id]; carry[id] = { hp: t.hp, max: t.max, shield: t.shield || 0 }; }
  carry.__mode = G.player.weaponMode; carry.__ult = G.player.ultCharge;
  if(CAMP){
    const idx = S.stage - CAMP.base, pl = PLANETS[CAMP.pi], diff = DIFFICULTIES[S.difficulty] || DIFFICULTIES.normal;
    if(idx > (S.campaign[pl.id] || 0)){ S.campaign[pl.id] = idx; const fb = Math.round((15 + CAMP.pi * 5) * diff.rewardMult); S.jade += fb; addFloat(G.player.x, G.player.y - 70, `First clear +${fb} ✦`, "#ffd166"); }
    if(idx >= 10){ save(); campaignVictory(); return; }
    CAMP.idx = idx + 1;
  }
  S.stage++;
  save();
  initArena(true, carry);
  refreshBattleUi();
  addFloat(G.player.x, G.player.y - 50, `STAGE ${S.stage}`, "#4be89c");
}
function updateParticlesOnly(dt){
  for(let i = G.particles.length - 1; i >= 0; i--){ const pt = G.particles[i]; pt.life -= dt; pt.x += pt.vx * dt; pt.y += pt.vy * dt; if(pt.life <= 0) G.particles.splice(i, 1); }
  for(let i = G.floats.length - 1; i >= 0; i--){ const fl = G.floats[i]; fl.life -= dt; fl.y += fl.vy * dt; if(fl.life <= 0) G.floats.splice(i, 1); }
}

function updateArena(dt){
  if(!G) return;
  G.time += dt;
  if(G.intro){ G.intro.t += dt; if(G.intro.t >= G.intro.dur) G.intro = null; }
  if(G.clearing){ G.clearing.t += dt; updateParticlesOnly(dt); if(G.clearing.t >= G.clearing.dur){ finishClearing(); return; } updateHudDom(); return; }
  if(G.defeated){ G.defeatT += dt; updateParticlesOnly(dt); return; }
  if(G.victory){ updateParticlesOnly(dt); return; }
  if(G.cutin){ G.cutin.t += dt; updateParticlesOnly(dt); if(G.cutin.t >= G.cutin.dur){ const k = G.cutin; G.cutin = null; if(k.kind === "ult2") runUlt2(); else runUlt(); } updateHudDom(); return; }
  const p = G.player;
  const buffs = getTeamBuffTotals(S.team);
  p.fireCd = Math.max(0, p.fireCd - dt);
  p.skillCd = Math.max(0, p.skillCd - dt);
  p.invuln = Math.max(0, p.invuln - dt);
  p.slowT = Math.max(0, (p.slowT || 0) - dt);
  p.dashCd = Math.max(0, (p.dashCd || 0) - dt);
  if(p.dashT > 0) p.dashT -= dt;

  if(p.samTimer > 0){
    p.samTimer = Math.max(0, p.samTimer - dt);
    if(Math.random() < 0.35) addBurst(p.x, p.y, "#55ffca", 1, 65);
    if(p.samTimer === 0) addFloat(p.x, p.y - 26, "Combustion Ended", "#ff8a3c");
  }

  let mx = 0, my = 0;
  if(keys["KeyW"] || keys["ArrowUp"]) my -= 1;
  if(keys["KeyS"] || keys["ArrowDown"]) my += 1;
  if(keys["KeyA"] || keys["ArrowLeft"]) mx -= 1;
  if(keys["KeyD"] || keys["ArrowRight"]) mx += 1;
  if(G.joy && G.joy.active){ mx = G.joy.x; my = G.joy.y; }
  else if(mx && my){ const inv = 1 / Math.SQRT2; mx *= inv; my *= inv; }
  if(mx || my){ p.lastMx = mx; p.lastMy = my; }

  if(mx || my) p.walkPhase += dt * 12;

  const spd = ((p.id === "ff" && p.samTimer > 0) ? 320 : 250) * (1 + buffs.spdPct) * (p.slowT > 0 ? 0.55 : 1) * ((p.id === "ff" && effStar("ff") >= 8) ? 1.25 : 1);
  if(p.dashT > 0){
    p.x = Math.max(p.r + 12, Math.min(G.w - p.r - 12, p.x + p.dvx * dt));
    p.y = Math.max(p.r + 12, Math.min(G.h - p.r - 12, p.y + p.dvy * dt));
    G.ghosts.push({ x: p.x, y: p.y, life: 0.32, color: EL_COLORS[ch(p.id)[2]] || "#fff" });
    dashPass(p);
  } else {
    p.x = Math.max(p.r + 12, Math.min(G.w - p.r - 12, p.x + mx * spd * dt));
    p.y = Math.max(p.r + 12, Math.min(G.h - p.r - 12, p.y + my * spd * dt));
  }
  resolveObstacles(p);

  const targetCamX = Math.max(0, Math.min(G.w - G.viewW, p.x - G.viewW * 0.5));
  const targetCamY = Math.max(0, Math.min(G.h - G.viewH, p.y - G.viewH * 0.5));
  G.camX += (targetCamX - G.camX) * Math.min(1, dt * 8);
  G.camY += (targetCamY - G.camY) * Math.min(1, dt * 8);

  if(G.memosprite){
    const ms = G.memosprite;
    const orbitAng = G.time * 2.4;
    const tx = p.x + Math.cos(orbitAng) * 38;
    const ty = p.y + Math.sin(orbitAng) * 38;
    ms.x += (tx - ms.x) * Math.min(1, dt * 8);
    ms.y += (ty - ms.y) * Math.min(1, dt * 8);
    ms.overdriveTimer = Math.max(0, ms.overdriveTimer - dt);
    ms.fireCd -= dt;
    if(ms.fireCd <= 0 && G.enemies.length > 0){
      ms.fireCd = ms.overdriveTimer > 0 ? 0.35 : 0.78;
      let nearest = null, bestD = Infinity;
      for(const e of G.enemies){
        if(e.hp <= 0) continue;
        const d = Math.hypot(e.x - ms.x, e.y - ms.y);
        if(d < bestD){ bestD = d; nearest = e; }
      }
      if(nearest){
        const a = Math.atan2(nearest.y - ms.y, nearest.x - ms.x);
        G.projectiles.push({
          x: ms.x, y: ms.y, vx: Math.cos(a)*460, vy: Math.sin(a)*460,
          r: ms.overdriveTimer > 0 ? 9 : 7,
          dmg: p.atk * (ms.overdriveTimer > 0 ? 0.95 : 0.58), toughDmg: 12,
          homing: 6.0, pierce: 1, life: 1.3, color: ms.color, gfx: "memory_prism", angle: a
        });
      }
    }
  }

  updateSpecials(dt);
  if(keys["Space"]) fireSkill();
  if(keys["ShiftLeft"] || keys["ShiftRight"] || keys["KeyF"]) doDash();
  if(keys["KeyQ"] || keys["KeyE"]) activateUltimate();
  if(keys["KeyR"]) activateUlt2();
  if(keys["MouseDown"]) firePrimary();

  for(let i = G.slashes.length - 1; i >= 0; i--){
    G.slashes[i].life -= dt;
    if(G.slashes[i].life <= 0) G.slashes.splice(i, 1);
  }
  for(let i = G.railBeams.length - 1; i >= 0; i--){
    G.railBeams[i].life -= dt;
    if(G.railBeams[i].life <= 0) G.railBeams.splice(i, 1);
  }

  for(let i = G.projectiles.length - 1; i >= 0; i--){
    const pr = G.projectiles[i];
    pr.life -= dt;
    if(pr.homing && G.enemies.length){
      let nearest = null, bestD = Infinity;
      for(const e of G.enemies){
        if(e.hp <= 0) continue;
        const d = Math.hypot(e.x - pr.x, e.y - pr.y);
        if(d < bestD){ bestD = d; nearest = e; }
      }
      if(nearest){
        const desired = Math.atan2(nearest.y - pr.y, nearest.x - pr.x);
        const curSpd = Math.hypot(pr.vx, pr.vy) || 380;
        const curAng = Math.atan2(pr.vy, pr.vx);
        let diff = desired - curAng;
        while(diff > Math.PI) diff -= Math.PI * 2;
        while(diff < -Math.PI) diff += Math.PI * 2;
        const nextAng = curAng + Math.max(-pr.homing*dt, Math.min(pr.homing*dt, diff));
        pr.vx = Math.cos(nextAng) * curSpd;
        pr.vy = Math.sin(nextAng) * curSpd;
        pr.angle = nextAng;
      }
    }
    if(!pr.enemyShot){ if(!pr.trail) pr.trail = []; pr.trail.push(pr.x, pr.y); if(pr.trail.length > 14) pr.trail.splice(0, 2); }
    pr.x += pr.vx * dt;
    pr.y += pr.vy * dt;

    if(pr.bounce && pr.bounce > 0){
      if(pr.x < pr.r + 6 || pr.x > G.w - pr.r - 6){ pr.vx *= -1; pr.bounce--; }
      if(pr.y < pr.r + 6 || pr.y > G.h - pr.r - 6){ pr.vy *= -1; pr.bounce--; }
    }

    let removePr = pr.life <= 0 || pr.x < -40 || pr.x > G.w + 40 || pr.y < -40 || pr.y > G.h + 40;

    if(!removePr && !pr.enemyShot){
      if(G.objective.type === "cores"){
        for(const core of G.objective.cores){
          if(core.hp > 0 && Math.hypot(core.x - pr.x, core.y - pr.y) < core.r + pr.r){
            if(!pr.hitIds) pr.hitIds = new Set();
            if(!pr.hitIds.has("core_"+core.id)){
              pr.hitIds.add("core_"+core.id);
              const d = Math.max(1, Math.round(pr.dmg));
              core.hp = Math.max(0, core.hp - d);
              addFloat(core.x, core.y - core.r - 6, `-${d}`, "#4be89c");
              addBurst(core.x, core.y, "#4be89c", 7, 120);
              if(core.hp === 0){
                G.objective.progress++;
                addBurst(core.x, core.y, "#ffd166", 18, 180);
                addFloat(core.x, core.y - 24, "NODE DESTROYED!", "#ffd166");
              }
              pr.pierce = (pr.pierce || 1) - 1;
              if(pr.pierce <= 0){ removePr = true; break; }
            }
          }
        }
      }

      if(!removePr){
        for(const e of G.enemies){
          if(e.hp <= 0) continue;
          if(pr.hitIds && pr.hitIds.has(e.uid)) continue;
          if(Math.hypot(e.x - pr.x, e.y - pr.y) < e.r + pr.r){
            if(!pr.hitIds) pr.hitIds = new Set();
            pr.hitIds.add(e.uid);
            damageEnemy(e, pr.dmg, pr.color, pr.toughDmg || 12);
            if(pr.dotDmg){ e.dotTimer = pr.dotDur; e.dotDmg = pr.dotDmg; }
            applyHitEffects(e, pr);
            if(pr.healOnHit) p.hp = Math.min(p.maxHp, p.hp + pr.healOnHit);
            if(pr.aoe){
              addBurst(pr.x, pr.y, pr.color, 10, 140);
              for(const other of G.enemies){
                if(other.hp > 0 && other.uid !== e.uid && Math.hypot(other.x - pr.x, other.y - pr.y) <= pr.aoe){
                  damageEnemy(other, pr.dmg * 0.55, pr.color, (pr.toughDmg || 12) * 0.6);
                  applyHitEffects(other, pr);
                  if(pr.pull){ const dx = pr.x - other.x, dy = pr.y - other.y, dd = Math.hypot(dx, dy) || 1, mvp = Math.min(dd, 55); other.x += dx / dd * mvp; other.y += dy / dd * mvp; }
                }
              }
            }
            pr.pierce = (pr.pierce || 1) - 1;
            if(pr.pierce <= 0){ removePr = true; break; }
          }
        }
      }
    }
    if(removePr) G.projectiles.splice(i, 1);
  }

  const tmG = G.slowT > 0 ? 0.35 : 1;
  const RANGE = { shooter:210, weaver:170, sniper:400, cryo_bot:250, summoner:300, healer:250, mortar:420, laser:340, chorus:300 };
  for(let i = G.enemies.length - 1; i >= 0; i--){
    const e = G.enemies[i];
    if(e.hp <= 0){ G.enemies.splice(i, 1); continue; }
    const edt = dt * tmG;
    e.flash = Math.max(0, e.flash - dt);
    if(e.slowT > 0) e.slowT -= dt;
    if(e.shredT > 0) e.shredT -= dt;
    if(e.weakT > 0) e.weakT -= dt;
    if(e.chorusT > 0) e.chorusT -= dt;
    if(e.ghost > 0) e.ghost -= dt;
    if(e.brokenTimer > 0){
      e.brokenTimer -= edt;
      if(e.brokenTimer <= 0 && e.maxToughness > 0) e.toughness = e.maxToughness;
    }
    if(e.dotTimer > 0){
      e.dotTimer -= dt;
      e.hp -= e.dotDmg * dt;
      if(e.hp <= 0){ e.hp = 1; damageEnemy(e, 5, "#d86bff", 0); G.enemies.splice(i, 1); continue; }
    }
    const ang = Math.atan2(p.y - e.y, p.x - e.x);
    const dist = Math.hypot(p.x - e.x, p.y - e.y);
    e.face = ang;
    const bdef = e.bossId ? BOSS_DEFS[e.bossId] : null;
    const rng = bdef ? bdef.keep : RANGE[e.arch];
    const mv = (e.slowT > 0 ? 0.5 : 1) * tmG * (e.chorusT > 0 ? 1.3 : 1);
    const wk = (e.weakT > 0 ? 0.7 : 1) * (e.chorusT > 0 ? 1.25 : 1);
    const stunned = e.brokenTimer > 0;
    let skipMove = false;

    if(!stunned){
      if(bdef){
        const enr = e.hp < e.maxHp * 0.5;
        if(enr && !e.enraged){ e.enraged = true; G.shake = 16; addFloat(e.x, e.y - e.r - 30, "ENRAGED!", "#ff3b5c"); addSlashGraphic(e.x, e.y, 0, 300, "#ff3b5c", "ring"); }
        if(e.dashT > 0){
          e.dashT -= edt; e.x += e.dvx * edt; e.y += e.dvy * edt; resolveObstacles(e); skipMove = true;
          if(!e.dashHit && dist < e.r + p.r + 12 && p.invuln <= 0){ e.dashHit = true; applyPlayerHit(e.atk * 2.0); G.shake = 12; }
        } else {
          e.bossT -= edt;
          if(e.bossT <= 0){ bossAttack(e, bdef.attacks[e.bossIdx++ % bdef.attacks.length], enr, ang); e.bossT = bdef.cd * (enr ? 0.62 : 1); }
        }
      } else if(e.arch === "healer"){
        e.summonCd -= edt;
        if(e.summonCd <= 0){
          e.summonCd = 1.4; e.telegraphTimer = 0.3;
          for(const o of G.enemies){ if(o !== e && o.hp > 0 && o.hp < o.maxHp && Math.hypot(o.x - e.x, o.y - e.y) < 240){ o.hp = Math.min(o.maxHp, o.hp + o.maxHp * 0.07); addBurst(o.x, o.y, "#26de81", 4, 60); } }
        }
      } else if(e.arch === "chorus"){
        for(const o of G.enemies) if(o !== e && o.hp > 0 && Math.hypot(o.x - e.x, o.y - e.y) < 320) o.chorusT = 0.4;
      } else if(e.arch === "phantom"){
        e.blinkCd -= edt;
        if(e.blinkCd <= 0){
          e.blinkCd = 3.6; addBurst(e.x, e.y, "#a29bfe", 8, 120);
          const a2 = Math.random() * 6.283;
          e.x = Math.max(60, Math.min(G.w - 60, p.x + Math.cos(a2) * 120));
          e.y = Math.max(60, Math.min(G.h - 60, p.y + Math.sin(a2) * 120));
          addBurst(e.x, e.y, "#a29bfe", 8, 120); e.atkCd = Math.min(e.atkCd, 0.35);
        }
      } else if(e.arch === "summoner"){
        e.summonCd -= edt;
        if(e.summonCd <= 0 && G.enemies.length < 28){
          e.summonCd = 6.5; e.telegraphTimer = 0.4;
          for(let k = 0; k < 2; k++) G.enemies.push(makeEnemy("drone", e.x + (k ? 30 : -30), e.y + 24, S.stage));
          addFloat(e.x, e.y - e.r - 20, "SUMMON!", "#fd79a8");
        }
      } else if(e.arch === "leaper"){
        e.summonCd -= edt;
        if(e.dashT > 0){
          e.dashT -= edt; e.x += e.dvx * edt; e.y += e.dvy * edt; resolveObstacles(e); skipMove = true;
          if(e.dashT <= 0) hazCircle(e.x, e.y, 90, 0.35, e.atk * 1.2, "#00cec9");
        } else if(e.summonCd <= 0 && dist < 520){
          e.summonCd = 3.4; e.dashT = 0.4; e.dvx = Math.cos(ang) * Math.min(dist, 480) / 0.4; e.dvy = Math.sin(ang) * Math.min(dist, 480) / 0.4;
          e.telegraphTimer = 0.4;
        }
      }
      if(e.arch !== "turret" && !skipMove){
        const keep = rng !== undefined ? rng : 14;
        const sp = e.spd * mv * (e.arch === "warden" ? 0.72 : 1);
        if(dist > keep){ e.x += Math.cos(ang) * sp * dt; e.y += Math.sin(ang) * sp * dt; }
        else if(rng !== undefined && !bdef && dist < keep * 0.65){ e.x -= Math.cos(ang) * sp * 0.7 * dt; e.y -= Math.sin(ang) * sp * 0.7 * dt; }
        resolveObstacles(e);
        e.x = Math.max(30, Math.min(G.w - 30, e.x)); e.y = Math.max(30, Math.min(G.h - 30, e.y));
      }
      e.stuckT += dt;
      if(e.stuckT >= 1.2){
        if(Math.hypot(e.x - e.lx, e.y - e.ly) < 8 && dist > 160 && e.arch !== "turret" && e.arch !== "mortar") e.ghost = 1.6;
        e.lx = e.x; e.ly = e.y; e.stuckT = 0;
      }
    }

    e.atkCd -= edt;
    const dmg = e.atk * wk;
    if(!stunned && !bdef){
      const shoot = (spd, o) => G.projectiles.push(Object.assign({ x: e.x, y: e.y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, r: 6, dmg, enemyShot: true, life: 2.6, color: "#ff5a6e", gfx: "enemy_orb" }, o || {}));
      if(e.arch === "sniper"){
        if(e.charge > 0){
          e.charge -= edt;
          if(e.charge <= 0) G.projectiles.push({ x: e.x, y: e.y, vx: Math.cos(e.aimAng) * 640, vy: Math.sin(e.aimAng) * 640, r: 6, dmg: dmg * 2.2, enemyShot: true, life: 1.4, color: "#ff7ab8", gfx: "enemy_orb" });
        } else if(dist < 440 && e.atkCd <= 0){ e.charge = 1.0; e.aimAng = ang; e.atkCd = 3.4; }
      } else if(e.arch === "turret"){
        if(dist < 560 && e.atkCd <= 0){ e.atkCd = 2.3; e.telegraphTimer = 0.25; for(const k of [-1, 0, 1]) shoot(280, { vx: Math.cos(ang + k * 0.2) * 280, vy: Math.sin(ang + k * 0.2) * 280, color: "#fdcb6e" }); }
      } else if(e.arch === "cryo_bot"){
        if(dist < 320 && e.atkCd <= 0){ e.atkCd = 2.2; e.telegraphTimer = 0.25; shoot(230, { color: "#74b9ff", r: 8, slowP: 2.2 }); }
      } else if(e.arch === "mortar"){
        if(dist < 640 && e.atkCd <= 0){ e.atkCd = 3.4; e.telegraphTimer = 0.3; hazCircle(p.x, p.y, 95, 1.15, dmg * 1.5, "#e17055"); }
      } else if(e.arch === "laser"){
        if(dist < 620 && e.atkCd <= 0){ e.atkCd = 4.2; e.telegraphTimer = 0.5; hazBeam(e.x, e.y, ang, 900, 34, 1.2, dmg * 1.7, "#ff7675"); }
      } else if(e.arch === "pool"){
        if(dist < 520 && e.atkCd <= 0){ e.atkCd = 3.0; e.telegraphTimer = 0.3; hazPool(p.x + (Math.random() - 0.5) * 90, p.y + (Math.random() - 0.5) * 90, 70, 5, dmg * 1.1, "#6ab04c"); }
      } else if(e.arch === "shooter" || e.arch === "weaver"){
        if(dist < 270 && e.atkCd <= 0){ e.atkCd = e.arch === "shooter" ? 1.85 : 1.6; e.telegraphTimer = 0.25; shoot(245, { color: e.arch === "weaver" ? "#c084fc" : "#ff5a6e" }); }
      } else if(e.arch === "bomber"){
        if(dist < e.r + p.r + 30){
          addBurst(e.x, e.y, "#ff9f1a", 22, 230); addSlashGraphic(e.x, e.y, 0, 95, "#ff9f1a", "ring");
