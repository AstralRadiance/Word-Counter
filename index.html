          e.hp = 1; damageEnemy(e, 5, "#ff9f1a", 0);
        }
      } else if(e.arch !== "healer" && e.arch !== "summoner" && e.arch !== "chorus" && e.arch !== "leaper"){
        if(dist < e.r + p.r + 20 && e.atkCd <= 0){
          e.atkCd = e.arch === "warden" ? 1.65 : 1.15; e.telegraphTimer = 0.25;
          if(dist < e.r + p.r + 22 && p.invuln <= 0) applyPlayerHit(dmg);
        }
      } else if(e.arch === "leaper"){
        if(dist < e.r + p.r + 18 && e.atkCd <= 0){ e.atkCd = 1.2; if(p.invuln <= 0) applyPlayerHit(dmg); }
      }
    }
    if(e.telegraphTimer > 0) e.telegraphTimer = Math.max(0, e.telegraphTimer - dt);
  }

  for(let i = G.projectiles.length - 1; i >= 0; i--){
    const pr = G.projectiles[i];
    if(!pr.enemyShot) continue;
    if(Math.hypot(p.x - pr.x, p.y - pr.y) < p.r + pr.r){
      G.projectiles.splice(i, 1);
      if(p.invuln <= 0){ applyPlayerHit(pr.dmg); if(pr.slowP) p.slowT = pr.slowP; }
    }
  }

  for(let i = G.particles.length - 1; i >= 0; i--){
    const pt = G.particles[i];
    pt.life -= dt;
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    if(pt.life <= 0) G.particles.splice(i, 1);
  }
  for(let i = G.floats.length - 1; i >= 0; i--){
    const fl = G.floats[i];
    fl.life -= dt;
    fl.y += fl.vy * dt;
    if(fl.life <= 0) G.floats.splice(i, 1);
  }

  const obj = G.objective;
  if(obj.type === "exterminate"){
    if(G.enemies.length === 0) completeStage();
  } else if(obj.type === "beacon"){
    const b = obj.beacon;
    if(Math.hypot(p.x - b.x, p.y - b.y) <= b.r + p.r){
      obj.progress = Math.min(obj.target, obj.progress + 14 * dt);
    }
    if(G.enemies.length < 3){
      G.spawnTimer -= dt;
      if(G.spawnTimer <= 0){ G.spawnTimer = 4.2; G.enemies.push(...spawnWave(S.stage, G.w, G.h).slice(0, 2)); }
    }
    if(obj.progress >= obj.target) completeStage();
  } else if(obj.type === "cores"){
    if(obj.progress >= obj.target) completeStage();
  } else if(obj.type === "survive"){
    obj.progress = Math.min(obj.target, obj.progress + dt);
    if(G.enemies.length < 4){
      G.spawnTimer -= dt;
      if(G.spawnTimer <= 0){ G.spawnTimer = 3.2; G.enemies.push(...spawnWave(S.stage, G.w, G.h).slice(0, 3)); }
    }
    if(obj.progress >= obj.target) completeStage();
  } else if(obj.type === "collect"){
    for(const it of obj.items){
      if(!it.got && Math.hypot(p.x - it.x, p.y - it.y) < it.r + p.r + 8){
        it.got = true; obj.progress++;
        addBurst(it.x, it.y, "#7ce0ff", 14, 170); addFloat(it.x, it.y - 18, `DATA SHARD ${obj.progress}/${obj.target}`, "#7ce0ff");
      }
    }
    if(G.enemies.length < 4){ G.spawnTimer -= dt; if(G.spawnTimer <= 0){ G.spawnTimer = 4.5; G.enemies.push(...spawnWave(S.stage, G.w, G.h).slice(0, 2)); } }
    if(obj.progress >= obj.target) completeStage();
  } else if(obj.type === "waves"){
    if(G.enemies.length === 0){
      obj.progress++;
      if(obj.progress >= obj.target) completeStage();
      else {
        G.enemies.push(...spawnWave(S.stage + obj.progress * 2, G.w, G.h));
        for(const e of G.enemies) resolveObstacles(e);
        addFloat(p.x, p.y - 56, `WAVE ${obj.progress + 1} / ${obj.target}`, "#ffd166");
      }
    }
  } else if(obj.type === "elites" || obj.type === "miniboss"){
    const left = G.enemies.filter(e => e.elite && e.hp > 0).length;
    obj.progress = obj.target - left;
    if(left === 0) completeStage();
  } else if(obj.type === "zones"){
    if(obj.zones.some(z => Math.hypot(p.x - z.x, p.y - z.y) <= z.r + p.r)) obj.progress = Math.min(obj.target, obj.progress + 16 * dt);
    if(G.enemies.length < 3){ G.spawnTimer -= dt; if(G.spawnTimer <= 0){ G.spawnTimer = 4.2; G.enemies.push(...spawnWave(S.stage, G.w, G.h).slice(0, 2)); } }
    if(obj.progress >= obj.target) completeStage();
  }

  if(p.hp <= 0 && !G.clearing){
    syncActiveToTeam();
    if(p.id === "ff" && effStar("ff") >= 8 && !G.phoenixUsed){
      G.phoenixUsed = true;
      p.hp = Math.round(p.maxHp * 0.6); p.invuln = 2.2; G.slowT = Math.max(G.slowT, 2);
      blast(p.x, p.y, 800, p.atk * 6, 120, "#ff6b3d", { slow: 2 });
      addSlashGraphic(p.x, p.y, 0, 260, "#ffbe3b", "ring"); addSlashGraphic(p.x, p.y, 0, 480, "#ff4df0", "ring");
      addFloat(p.x, p.y - 50, "🔥 Ω PHOENIX REBIRTH!", "#ffbe3b");
      for(const id in G.teamHp){ if(id !== p.id && G.teamHp[id].hp > 0){ const t = G.teamHp[id]; t.hp = Math.min(t.max, t.hp + Math.round(t.max * 0.2)); } }
    } else {
      const nextIdx = S.team.findIndex(tid => G.teamHp[tid] && G.teamHp[tid].hp > 0);
      if(nextIdx >= 0){
        addFloat(p.x, p.y - 30, `${ch(p.id)[1]} FALLEN!`, "#ff5a6e");
        switchActiveCharacter(nextIdx, true);
        G.player.invuln = 1.2;
      } else {
        showDefeat();
        return;
      }
    }
  }
  syncActiveToTeam();

  updateHudDom();
}

function applyPlayerHit(rawDmg){
  if(!G) return;
  const p = G.player;
  let dmg = Math.max(1, Math.round(rawDmg));
  if(p.shield > 0){
    const absorbed = Math.min(p.shield, dmg);
    p.shield -= absorbed;
    dmg -= absorbed;
    addFloat(p.x, p.y - 16, `SHIELD -${absorbed}`, "#58b8ff");
  }
  if(dmg > 0){
    p.hp = Math.max(0, p.hp - dmg);
    p.invuln = 0.35;
    addBurst(p.x, p.y, "#ff5a6e", 7, 120);
    addFloat(p.x, p.y - 24, `-${dmg}`, "#ff5a6e");
  }
}

const ENV_CACHE = {};

function envRng(seed){ return ()=>{ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function envHash(s){ let h = 2166136261; for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

function buildEnvLayer(w, h, map){

  if(theme === "tech"){

  } else if(theme === "ice"){

    for(let i = 0; i < 30; i++){ g.fillStyle = "rgba(235,248,255,0.07)"; g.beginPath(); g.ellipse(R() * w, R() * h, (60 + R() * 120) * sc + 12, (20 + R() * 40) * sc + 6, R(), 0, 6.28); g.fill(); }
    for(let i = 0; i < 70; i++){ const x = R() * w, y = R() * h, s = (5 + R() * 11) * sc + 2; g.fillStyle = "rgba(160,225,255,0.35)"; g.beginPath(); g.moveTo(x, y - s); g.lineTo(x + s * 0.5, y + s * 0.6); g.lineTo(x - s * 0.5, y + s * 0.6); g.fill(); }
  } else if(theme === "water"){
    for(let i = 0; i < 46; i++){ const y = R() * h, x0 = R() * w, len = (200 + R() * 320) * sc + 40; g.strokeStyle = A + "33"; g.lineWidth = 1.6 * sc + 0.8; g.beginPath(); for(let k = 0; k <= len; k += 8){ const yy = y + Math.sin(k * 0.04 / (sc + 0.2)) * 7 * sc; k ? g.lineTo(x0 + k, yy) : g.moveTo(x0, yy); } g.stroke(); }
    for(let i = 0; i < 24; i++){ const x = R() * w, y = R() * h; for(let k = 1; k <= 3; k++){ g.strokeStyle = A + (k === 1 ? "44" : "22"); g.lineWidth = 1.4; g.beginPath(); g.ellipse(x, y, (14 + k * 14) * sc + 4, (6 + k * 6) * sc + 2, 0, 0, 6.28); g.stroke(); } }

    g.fillStyle = "rgba(0,0,0,0.35)"; for(let x = T * 0.5; x < w; x += T * 2){ for(let y = T * 0.5; y < h; y += T * 2){ g.beginPath(); g.arc(x, y, 3 * sc + 1.5, 0, 6.28); g.fill(); } }
  } else if(theme === "dream"){
    for(let x = 0, i = 0; x < w; x += T * 1.5, i++){ for(let y = 0, j = 0; y < h; y += T * 1.5, j++){ if((i + j) % 2) { g.fillStyle = "rgba(255,200,61,0.05)"; g.fillRect(x, y, T * 1.5, T * 1.5); } } }
    const cols = ["#ff6b81", "#feca57", "#48dbfb", "#ff9ff3", "#1dd1a1"];
    for(let i = 0; i < 90; i++){ g.fillStyle = cols[i % 5] + "55"; g.beginPath(); g.arc(R() * w, R() * h, (3 + R() * 7) * sc + 1.5, 0, 6.28); g.fill(); }
    for(let i = 0; i < 40; i++){ const x = R() * w, y = R() * h, s = (8 + R() * 14) * sc + 3; g.fillStyle = "#fff6c8aa"; g.beginPath(); g.moveTo(x, y - s); g.lineTo(x + s * 0.25, y - s * 0.25); g.lineTo(x + s, y); g.lineTo(x + s * 0.25, y + s * 0.25); g.lineTo(x, y + s); g.lineTo(x - s * 0.25, y + s * 0.25); g.lineTo(x - s, y); g.lineTo(x - s * 0.25, y - s * 0.25); g.fill(); }
  } else if(theme === "sun"){
    const rg = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w * 0.5);
    rg.addColorStop(0, A + "30"); rg.addColorStop(1, "transparent"); g.fillStyle = rg; g.fillRect(0, 0, w, h);
    g.save(); g.translate(w / 2, h / 2); g.fillStyle = A + "10";
    for(let k = 0; k < 16; k++){ g.rotate(Math.PI / 8); g.beginPath(); g.moveTo(0, 0); g.lineTo(w, -34 * sc - 8); g.lineTo(w, 34 * sc + 8); g.fill(); }
    g.restore();
    for(let i = 0; i < 22; i++){ glowLine(jag(R() * w, R() * h, R() * 6.28, (120 + R() * 200) * sc + 24, 5, 1.1), "rgba(255,230,170,0.22)", 1.5 * sc + 0.7, 4); }
  } else if(theme === "planar"){
    const sky = g.createLinearGradient(0, 0, 0, h); sky.addColorStop(0, "#fdeaff22"); sky.addColorStop(1, "#6a4cff26"); g.fillStyle = sky; g.fillRect(0, 0, w, h);
    for(let i = 0; i < 8; i++){ g.strokeStyle = i % 2 ? "#ffe6a266" : "#ffb7f155"; g.lineWidth = (9 + R() * 14) * sc + 3; g.beginPath(); const y0 = R() * h; g.moveTo(-50, y0); g.bezierCurveTo(w * 0.3, y0 - 420 * sc, w * 0.6, y0 + 520 * sc, w + 50, y0 + (R() - 0.5) * 700 * sc); g.stroke(); }
    for(let i = 0; i < 18; i++){ const x = R() * w, y = R() * h, rw = (90 + R() * 190) * sc + 30, rh = rw * 0.34;
      g.fillStyle = "#b79cff33"; g.beginPath(); g.moveTo(x - rw, y); g.quadraticCurveTo(x, y + rh * 3.2, x + rw, y); g.fill();
      g.fillStyle = "#ffffff38"; g.beginPath(); g.ellipse(x, y, rw, rh, 0, 0, 6.283); g.fill();
      g.strokeStyle = "#ffffff66"; g.lineWidth = 1.5; g.stroke(); }
    for(let i = 0; i < 12; i++){ g.strokeStyle = A + "44"; g.lineWidth = 2 * sc + 1; g.beginPath(); g.arc(R() * w, R() * h, (60 + R() * 200) * sc + 20, 0, 6.283); g.stroke(); }
    for(let i = 0; i < 160; i++){ const x = R() * w, y = R() * h, s = (3 + R() * 7) * sc + 1.5; g.fillStyle = i % 3 ? "#ffffffaa" : "#ffe9a8cc"; g.beginPath(); g.moveTo(x, y - s); g.lineTo(x + s * 0.28, y - s * 0.28); g.lineTo(x + s, y); g.lineTo(x + s * 0.28, y + s * 0.28); g.lineTo(x, y + s); g.lineTo(x - s * 0.28, y + s * 0.28); g.lineTo(x - s, y); g.lineTo(x - s * 0.28, y - s * 0.28); g.fill(); }

    for(let i = 0; i < 260; i++){ g.fillStyle = `rgba(255,255,255,${0.2 + R() * 0.6})`; g.beginPath(); g.arc(R() * w, R() * h, (0.5 + R() * 1.6) * (sc * 1.5 + 0.5), 0, 6.283); g.fill(); }

  } else if(theme === "garden"){

    g.strokeStyle = "rgba(220,205,170,0.14)"; g.lineWidth = 34 * sc + 8; g.beginPath(); g.moveTo(0, h * 0.5); g.bezierCurveTo(w * 0.3, h * 0.2, w * 0.7, h * 0.8, w, h * 0.5); g.stroke();
    const pc = ["#ffb7d5", "#fff0a8", "#ffffff"]; for(let i = 0; i < 90; i++){ g.fillStyle = pc[i % 3] + "88"; g.beginPath(); g.ellipse(R() * w, R() * h, (4 + R() * 4) * (sc + 0.4), (2 + R() * 2) * (sc + 0.4), R() * 3, 0, 6.283); g.fill(); }
  } else { // rift
    for(let i = 0; i < 18; i++){ glowLine(jag(R() * w, R() * h, R() * 6.28, (200 + R() * 320) * sc + 40, 8, 1.7), A + "bb", 3 * sc + 1, 18); }
    for(let i = 0; i < 40; i++){ const x = R() * w, y = R() * h, s = (8 + R() * 22) * sc + 3; g.fillStyle = "rgba(20,8,14,0.75)"; g.strokeStyle = A + "66"; g.lineWidth = 1.2; g.beginPath(); g.moveTo(x, y - s); g.lineTo(x + s, y + s * 0.3); g.lineTo(x + s * 0.2, y + s); g.lineTo(x - s * 0.8, y + s * 0.4); g.closePath(); g.fill(); g.stroke(); }
  }

  // central emblem
  g.save(); g.translate(w / 2, h / 2);
  for(const [r, a, lw] of [[240, "3a", 3], [170, "44", 2], [100, "55", 2.5]]){ g.strokeStyle = A + a; g.lineWidth = lw * sc + 1; g.beginPath(); g.arc(0, 0, r * sc + 12, 0, 6.28); g.stroke(); }
  g.strokeStyle = A + "40"; g.lineWidth = 1.5;
  for(let k = 0; k < 48; k++){ const a = k * Math.PI / 24, r1 = 240 * sc + 12, r2 = r1 - (k % 4 === 0 ? 18 : 8) * sc - 3; g.beginPath(); g.moveTo(Math.cos(a) * r1, Math.sin(a) * r1); g.lineTo(Math.cos(a) * r2, Math.sin(a) * r2); g.stroke(); }
  g.beginPath(); for(let k = 0; k < 8; k++){ const a = k * Math.PI / 4 + Math.PI / 8, r = 170 * sc + 8; k ? g.lineTo(Math.cos(a) * r, Math.sin(a) * r) : g.moveTo(Math.cos(a) * r, Math.sin(a) * r); } g.closePath(); g.stroke();
  g.restore();

  // border frame + vignette
  g.strokeStyle = A + "55"; g.lineWidth = 6 * sc + 2; g.strokeRect(3, 3, w - 6, h - 6);
  const vg = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.3, w / 2, h / 2, Math.max(w, h) * 0.75);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,0.62)");
  g.fillStyle = vg; g.fillRect(0, 0, w, h);
  return cv;
}

function drawObstacle(ctx, ob, map, time){
  const cx = ob.x + ob.w / 2, cy = ob.y + ob.h / 2, A = map.accent;
  ctx.save();
  if(ob.kind !== "wall"){ ctx.fillStyle = "#00000077";
  ctx.beginPath(); ctx.ellipse(cx, ob.y + ob.h + 5, ob.w * 0.55, 11, 0, 0, 6.28); ctx.fill(); }
  const pulse = 0.5 + Math.sin(time * 3 + ob.x) * 0.5;
  if(ob.kind === "ice_crystal"){
    const g = ctx.createLinearGradient(ob.x, ob.y, ob.x + ob.w, ob.y + ob.h);
    g.addColorStop(0, "#e9fbff"); g.addColorStop(0.5, "#7ad4f2"); g.addColorStop(1, "#2a6e96");
    ctx.fillStyle = g; ctx.strokeStyle = "#d8f6ff"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx, ob.y - 14); ctx.lineTo(ob.x + ob.w, ob.y + ob.h * 0.35); ctx.lineTo(ob.x + ob.w * 0.8, ob.y + ob.h); ctx.lineTo(ob.x + ob.w * 0.2, ob.y + ob.h); ctx.lineTo(ob.x, ob.y + ob.h * 0.35); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = "#ffffff88"; ctx.beginPath(); ctx.moveTo(cx, ob.y - 14); ctx.lineTo(cx, ob.y + ob.h); ctx.moveTo(ob.x, ob.y + ob.h * 0.35); ctx.lineTo(ob.x + ob.w * 0.8, ob.y + ob.h); ctx.stroke();

function drawStageEnvironment(ctx, w, h, map, time){
  const key = `${map.id}_${w}x${h}`;
  if(!ENV_CACHE[key]){
    const ks = Object.keys(ENV_CACHE).filter(k2 => k2.endsWith(`_${w}x${h}`));
    if(ks.length >= 2) delete ENV_CACHE[ks[0]];
    ENV_CACHE[key] = buildEnvLayer(w, h, map);
  }
  ctx.drawImage(ENV_CACHE[key], 0, 0, w, h);

  const A = map.accent, sc = w / 2200;
  const pr = 1 + Math.sin(time * 2) * 0.025;
  ctx.save();
  ctx.strokeStyle = A + "55"; ctx.lineWidth = 3 * sc + 1;
  ctx.beginPath(); ctx.arc(w / 2, h / 2, (240 * sc + 12) * pr, 0, 6.28); ctx.stroke();
  ctx.translate(w / 2, h / 2); ctx.rotate(time * 0.15);
  ctx.strokeStyle = A + "44"; ctx.setLineDash([14 * sc + 4, 18 * sc + 6]); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, 170 * sc + 8, 0, 6.28); ctx.stroke();
  ctx.restore();
  ctx.save();
  for(let i = 0; i < 26; i++){
    const sp = 8 + (i % 7) * 4;
    const x = (i * 877 % w + time * sp * (sc + 0.3)) % w;
    const y = (i * 541 % h + Math.sin(time * 0.6 + i) * 18) % h;
    ctx.fillStyle = A + (i % 3 ? "30" : "55");
    ctx.beginPath(); ctx.arc(x, y, (1.4 + (i % 4) * 0.7) * (sc * 1.6 + 0.4), 0, 6.28); ctx.fill();
  }
  ctx.restore();

  if(w >= 2000 && map.obstacles){
    for(const ob of map.obstacles){
      if(typeof G !== "undefined" && G && (ob.x > G.camX + G.viewW + 80 || ob.x + ob.w < G.camX - 80 || ob.y > G.camY + G.viewH + 80 || ob.y + ob.h < G.camY - 80)) continue;
      drawObstacle(ctx, ob, map, time);
    }
  }
}

function drawCharacterAvatar(ctx, p, c, st, isSamForm){
  const aimAng = Math.atan2(p.aimY - p.y, p.aimX - p.x);
  const bob = Math.sin(p.walkPhase) * 2.2;
  const hairCol = c[9] || "#dfe6e9";
  const outfitCol = c[10] || "#7c8cff";
  const elCol = EL_COLORS[c[2]] || "#7c8cff";

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.fillStyle = "#00000077";
  ctx.beginPath(); ctx.ellipse(0, p.r + 4, p.r * 0.85, 6, 0, 0, Math.PI * 2); ctx.fill();

  ctx.strokeStyle = isSamForm ? "#55ffca" : (st >= 7 ? "#ff8a3c" : elCol + "77");
  ctx.lineWidth = isSamForm || st >= 7 ? 3 : 2;
  ctx.beginPath(); ctx.ellipse(0, p.r + 2, p.r * 1.15, 8, 0, 0, Math.PI * 2); ctx.stroke();

  if(p.shield > 0){
    ctx.strokeStyle = "#58b8ff";
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, p.r + 9, 0, Math.PI * 2); ctx.stroke();
  }

  ctx.translate(0, bob);

  if(isSamForm){
    ctx.save();
    ctx.rotate(aimAng);
    ctx.fillStyle = "#55ffca";
    ctx.shadowColor = "#55ffca";
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.moveTo(-8, -10); ctx.lineTo(-28, -22); ctx.lineTo(-18, -4);
    ctx.moveTo(-8, 10);  ctx.lineTo(-28, 22);  ctx.lineTo(-18, 4);
    ctx.fill();
    ctx.fillStyle = "#ff6b3d";
    ctx.fillRect(10, -14, 22, 4);
    ctx.fillRect(10, 10, 22, 4);
    ctx.restore();

    ctx.fillStyle = "#dfe6e9";
    ctx.strokeStyle = "#ff5a3c";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(-14, -12, 28, 24, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#2d3436";
    ctx.beginPath(); ctx.arc(0, -6, 11, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#55ffca";
    ctx.fillRect(-7, -8, 14, 4);
  } else {
    ctx.fillStyle = outfitCol;
    ctx.beginPath();
    ctx.moveTo(-12, 0); ctx.lineTo(12, 0); ctx.lineTo(15, 16); ctx.lineTo(-15, 16);
    ctx.closePath(); ctx.fill();

    ctx.save();
    ctx.rotate(aimAng);
    ctx.strokeStyle = elCol;
    ctx.fillStyle = elCol;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(25, 0); ctx.stroke();
    ctx.restore();

    ctx.fillStyle = "#ffeaa7";
    ctx.beginPath(); ctx.arc(0, -5, 10.5, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = hairCol;
    ctx.beginPath();
    ctx.arc(0, -7, 11.2, Math.PI * 0.92, Math.PI * 2.08);
    ctx.lineTo(11, 2); ctx.lineTo(6, -4); ctx.lineTo(0, -2); ctx.lineTo(-6, -4); ctx.lineTo(-11, 2);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = elCol;
    ctx.fillRect(-5, -5, 3, 3.5);
    ctx.fillRect(2, -5, 3, 3.5);
  }

  ctx.font = "bold 11px system-ui";
  ctx.textAlign = "center";
  ctx.fillStyle = isSamForm ? "#55ffca" : "#eef0ff";
  const label = isSamForm ? `SAM: Type-IV (${p.samTimer.toFixed(1)}s)` : `${c[1]} (${st}★)`;
  ctx.fillText(label, 0, -p.r - 12);
  ctx.restore();
}

      eye(-r * 0.3, -r * 0.1, 3, "#eaffd0"); eye(r * 0.3, -r * 0.1, 3, "#eaffd0");
      ctx.fillStyle = glow; for(const dx of [-0.5, 0, 0.5]) { poly([[dx * r - 3, r * 0.8], [dx * r, r * 1.2 + Math.sin(time * 5 + dx) * 3], [dx * r + 3, r * 0.8]]); ctx.fill(); } break; }
    case "chorus": {
      circ(0, 0, r); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#1a0f10"; ctx.beginPath(); ctx.ellipse(0, r * 0.25, r * 0.35, r * 0.28 + Math.abs(Math.sin(time * 6)) * r * 0.15, 0, 0, 6.283); ctx.fill();
      eye(-r * 0.35, -r * 0.3, 2.6, "#fff"); eye(r * 0.35, -r * 0.3, 2.6, "#fff");
      ctx.fillStyle = glow; ctx.font = "bold 14px system-ui"; ctx.textAlign = "center"; for(let k = 0; k < 3; k++){ const aa = time * 2 + k * 2.09; ctx.fillText("♪", Math.cos(aa) * r * 1.4, Math.sin(aa) * r * 1.0 - r * 0.6); } break; }
    default:
      circ(0, 0, r); ctx.fill(); ctx.stroke(); eye(-r*0.32, -2, 2.6); eye(r*0.32, -2, 2.6);
  }
  if(e.faction && !e.bossId) drawFactionOverlay(ctx, e, r, time, flash);
  ctx.restore();

  const bw = Math.max(26, e.r * 2.3), bh = 5;
  ctx.fillStyle = "#000000aa"; ctx.fillRect(e.x - bw/2, e.y - e.r - 15, bw, bh);
  ctx.fillStyle = e.elite ? "#ffd166" : "#ff5a6e"; ctx.fillRect(e.x - bw/2, e.y - e.r - 15, bw * Math.max(0, e.hp / e.maxHp), bh);
  if(e.maxToughness > 0){
    ctx.fillStyle = "#000000aa"; ctx.fillRect(e.x - bw/2, e.y - e.r - 9, bw, 3.5);
    ctx.fillStyle = e.brokenTimer > 0 ? "#94a3b8" : "#facc15"; ctx.fillRect(e.x - bw/2, e.y - e.r - 9, bw * Math.max(0, e.toughness / e.maxToughness), 3.5);
  }
  if(e.elite || e.shredT > 0 || e.weakT > 0){
    ctx.font = "bold 10px system-ui"; ctx.textAlign = "center"; ctx.fillStyle = "#ffd166";
    ctx.fillText((e.elite ? "👑 " : "") + (e.shredT > 0 ? "🔻" : "") + (e.weakT > 0 ? "💜" : ""), e.x, e.y - e.r - 20);
  }
}

function drawProjectileGraphic(ctx, pr){
  const col = pr.color || "#fff", g = pr.gfx || "orb";
  if(pr.trail && pr.trail.length >= 4){
    ctx.save(); ctx.lineCap = "round"; ctx.strokeStyle = col;
    const n = pr.trail.length / 2;
    for(let i = 1; i < n; i++){
      ctx.globalAlpha = (i / n) * 0.5; ctx.lineWidth = Math.max(1.5, pr.r * 1.5 * (i / n));
      ctx.beginPath(); ctx.moveTo(pr.trail[(i - 1) * 2], pr.trail[(i - 1) * 2 + 1]); ctx.lineTo(pr.trail[i * 2], pr.trail[i * 2 + 1]); ctx.stroke();
    }
    ctx.restore();
  }
  ctx.save();
  ctx.translate(pr.x, pr.y);
  const t = performance.now() * 0.001;
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 16;
  const R = pr.r;
  if(g === "enemy_orb"){
    ctx.shadowBlur = 14; ctx.beginPath(); ctx.arc(0, 0, R * (1 + Math.sin(t * 20) * 0.1), 0, 6.283); ctx.fill();
    ctx.fillStyle = "#1a0a14"; ctx.beginPath(); ctx.arc(0, 0, R * 0.55, 0, 6.283); ctx.fill();
    ctx.strokeStyle = "#fff8"; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(0, 0, R * 0.9, 0, 6.283); ctx.stroke();
  } else {
    if(pr.angle != null) ctx.rotate(pr.angle);
    if(g === "plasma_lance" || g === "arrow_lance" || g === "ricochet_dagger"){
      ctx.beginPath(); ctx.moveTo(R * 2.4, 0); ctx.lineTo(-R * 1.2, R * 0.6); ctx.lineTo(-R * 0.5, 0); ctx.lineTo(-R * 1.2, -R * 0.6); ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0; ctx.fillStyle = "#ffffffcc"; ctx.beginPath(); ctx.moveTo(R * 1.8, 0); ctx.lineTo(-R * 0.4, R * 0.18); ctx.lineTo(-R * 0.4, -R * 0.18); ctx.closePath(); ctx.fill();
    } else if(g === "flame_crescent"){
      ctx.lineWidth = Math.max(3, R * 0.7); ctx.lineCap = "round";
      ctx.beginPath(); ctx.arc(-R * 0.6, 0, R * 1.5, -1.0, 1.0); ctx.stroke();
      ctx.shadowBlur = 0; ctx.strokeStyle = "#ffffffaa"; ctx.lineWidth = Math.max(1.5, R * 0.25); ctx.beginPath(); ctx.arc(-R * 0.6, 0, R * 1.5, -0.8, 0.8); ctx.stroke();
    } else if(g === "star_shuriken"){
      ctx.rotate(t * 14);
      ctx.beginPath(); for(let k = 0; k < 8; k++){ const rr = k % 2 ? R * 0.45 : R * 1.5, aa = k * Math.PI / 4; k ? ctx.lineTo(Math.cos(aa) * rr, Math.sin(aa) * rr) : ctx.moveTo(Math.cos(aa) * rr, Math.sin(aa) * rr); } ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0; ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(0, 0, R * 0.3, 0, 6.283); ctx.fill();
    } else if(g === "void_ring"){
      ctx.lineWidth = Math.max(2.5, R * 0.45); ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.283); ctx.stroke();
      ctx.fillStyle = "#12061f"; ctx.beginPath(); ctx.arc(0, 0, R * 0.6, 0, 6.283); ctx.fill();
    } else if(g === "ember_meteor"){
      const fg = ctx.createRadialGradient(0, 0, 1, 0, 0, R * 1.5); fg.addColorStop(0, "#fff"); fg.addColorStop(0.4, col); fg.addColorStop(1, col + "00");
      ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(0, 0, R * 1.5, 0, 6.283); ctx.fill();
      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(-R * 0.5, -R * 0.7); ctx.lineTo(-R * 3.2, 0); ctx.lineTo(-R * 0.5, R * 0.7); ctx.closePath(); ctx.globalAlpha = 0.6; ctx.fill();
    } else if(g === "memory_prism"){
      ctx.beginPath(); ctx.moveTo(R * 1.7, 0); ctx.lineTo(0, R); ctx.lineTo(-R * 1.5, 0); ctx.lineTo(0, -R); ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0; ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.3; ctx.stroke();
      ctx.fillStyle = "#ffffff88"; ctx.beginPath(); ctx.moveTo(R * 0.9, 0); ctx.lineTo(0, R * 0.4); ctx.lineTo(0, -R * 0.4); ctx.closePath(); ctx.fill();
    } else if(g === "elation_die"){
      ctx.rotate(pr.life * 10);
      ctx.fillRect(-R * 0.85, -R * 0.85, R * 1.7, R * 1.7);
      ctx.shadowBlur = 0; ctx.fillStyle = "#fff";
      for(const [dx, dy] of [[-0.4, -0.4], [0.4, 0.4], [0, 0], [0.4, -0.4], [-0.4, 0.4]]){ ctx.beginPath(); ctx.arc(dx * R, dy * R, R * 0.16, 0, 6.283); ctx.fill(); }
    } else {
      const og = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 1.4); og.addColorStop(0, "#fff"); og.addColorStop(0.45, col); og.addColorStop(1, col + "00");
      ctx.fillStyle = og; ctx.beginPath(); ctx.arc(0, 0, R * 1.4, 0, 6.283); ctx.fill();
    }
  }
  ctx.restore();
}

function drawArena(){
  const canvas = $("#arena");
  if(!canvas || !G) return;
  const ctx = canvas.getContext("2d");
  const {w, h, viewW, viewH, camX, camY, player: p, map, objective: obj, time} = G;

  ctx.save();
  const shk = G.shake || 0;
  ctx.translate(-camX + (shk ? (Math.random() - 0.5) * shk : 0), -camY + (shk ? (Math.random() - 0.5) * shk : 0));

  drawStageEnvironment(ctx, w, h, map, time);

  if(obj.type === "beacon" && obj.beacon){
    const b = obj.beacon;
    ctx.save();
    ctx.fillStyle = "#7ce0ff18";
    ctx.strokeStyle = "#7ce0ffaa";
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.font = "bold 12px system-ui";
    ctx.fillStyle = "#aef0ff";
    ctx.textAlign = "center";
    ctx.fillText(`📡 BEACON ${Math.floor(obj.progress)}%`, b.x, b.y - b.r - 8);
    ctx.restore();
  } else if(obj.type === "cores"){
    for(const core of obj.cores){
      if(core.hp <= 0) continue;
      ctx.save();
      ctx.fillStyle = "#2ecc7133";
      ctx.strokeStyle = "#4be89c";
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(core.x, core.y, core.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      const bw = 44, bh = 5;
      ctx.fillStyle = "#000000aa";
      ctx.fillRect(core.x - bw/2, core.y - core.r - 11, bw, bh);
      ctx.fillStyle = "#4be89c";
      ctx.fillRect(core.x - bw/2, core.y - core.r - 11, bw * (core.hp / core.maxHp), bh);
      ctx.restore();
    }
  }

  // Railgun Beams (Hyper-piercing plasma beams!)
  for(const rb of G.railBeams){
    const alpha = Math.max(0, rb.life / rb.maxLife);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.lineCap = "round";
    ctx.strokeStyle = rb.color;
    ctx.shadowColor = rb.color;
    ctx.shadowBlur = 22;
    ctx.lineWidth = rb.width * alpha * 1.4;
    ctx.beginPath(); ctx.moveTo(rb.x1, rb.y1); ctx.lineTo(rb.x2, rb.y2); ctx.stroke();

    ctx.strokeStyle = rb.coreColor;
    ctx.lineWidth = rb.width * alpha * 0.45;
    ctx.beginPath(); ctx.moveTo(rb.x1, rb.y1); ctx.lineTo(rb.x2, rb.y2); ctx.stroke();
    ctx.restore();
  }

  for(const sl of G.slashes){
    const alpha = Math.max(0, sl.life / sl.maxLife);
    ctx.save();
    ctx.translate(sl.x, sl.y);
    ctx.rotate(sl.angle);
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = sl.color;
    ctx.lineWidth = 5;
    ctx.beginPath();
    if(sl.style === "ring") ctx.arc(0, 0, sl.radius * (1.15 - alpha * 0.35), 0, Math.PI * 2);
    else ctx.arc(0, 0, sl.radius, -Math.PI * 0.42, Math.PI * 0.42);
    ctx.stroke();
    ctx.restore();
  }

  ctx.strokeStyle = "#ffffff22";
  ctx.setLineDash([5, 5]);
  ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.aimX, p.aimY); ctx.stroke();
  ctx.setLineDash([]);

  drawExtras(ctx, time);
  for(const pr of G.projectiles) drawProjectileGraphic(ctx, pr);
  for(const e of G.enemies) drawEnemyVector(ctx, e, time);

  if(G.memosprite){
    const ms = G.memosprite;
    ctx.save();
    ctx.translate(ms.x, ms.y + Math.sin(time * 5) * 4);
    ctx.fillStyle = ms.color;
    ctx.shadowColor = ms.color;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(0, -10); ctx.lineTo(14, 0); ctx.lineTo(0, 10); ctx.lineTo(-14, 0);
    ctx.closePath(); ctx.fill();
    ctx.font = "bold 9px system-ui";
    ctx.textAlign = "center";
    ctx.fillText(ms.name, 0, -14);
    ctx.restore();
  }

  const c = ch(p.id);
  const st = effStar(p.id);
  drawCharacterAvatar(ctx, p, c, st, p.id === "ff" && p.samTimer > 0);

  for(const pt of G.particles){
    ctx.globalAlpha = Math.max(0, pt.life * 2);
    ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for(const fl of G.floats){
    ctx.globalAlpha = Math.min(1, fl.life * 1.4);
    ctx.font = "bold 13px system-ui";
    ctx.textAlign = "center";
    ctx.fillStyle = fl.color;
    ctx.fillText(fl.text, fl.x, fl.y);
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // Minimap Radar
  const mw = 168, mh = Math.round(168 * h / w), mx = viewW - mw - 12, my = IS_MOBILE ? 140 : 62;
  ctx.save();
  ctx.fillStyle = "#060913cc";
  ctx.strokeStyle = "#7c8cff66";
  ctx.lineWidth = 1.5;
  ctx.fillRect(mx, my, mw, mh);
  ctx.strokeRect(mx, my, mw, mh);
  ctx.strokeStyle = "#ffd16688";
  ctx.strokeRect(mx + (camX / w) * mw, my + (camY / h) * mh, (viewW / w) * mw, (viewH / h) * mh);
  ctx.fillStyle = "#ff5a6e";
  for(const e of G.enemies){
    ctx.fillRect(mx + (e.x / w) * mw - 2, my + (e.y / h) * mh - 2, e.boss ? 6 : 4, e.boss ? 6 : 4);
  }
  ctx.fillStyle = "#4be89c";
  ctx.beginPath(); ctx.arc(mx + (p.x / w) * mw, my + (p.y / h) * mh, 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ffd166";
  for(const d of G.drops) ctx.fillRect(mx + (d.x / w) * mw - 1, my + (d.y / h) * mh - 1, 2.5, 2.5);
  ctx.restore();
  drawOverlays(ctx, viewW, viewH);
}

function drawExtras(ctx, time){
  const p = G.player, obj = G.objective, A = G.map.accent;
  for(const h of G.hazards){
    const k = Math.min(1, h.t / h.delay);
    ctx.save();
    if(h.k === "c"){
      ctx.fillStyle = h.color + "22"; ctx.strokeStyle = h.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, 6.283); ctx.fill(); ctx.stroke();
      ctx.fillStyle = h.color + "55"; ctx.beginPath(); ctx.arc(h.x, h.y, h.r * k, 0, 6.283); ctx.fill();
    } else if(h.k === "b"){
      ctx.translate(h.x, h.y); ctx.rotate(h.ang);
      ctx.fillStyle = h.color + (h.dmg > 0 ? "22" : "18"); ctx.fillRect(0, -h.w / 2, h.len, h.w);
      ctx.fillStyle = h.color + "66"; ctx.fillRect(0, -h.w / 2 * k, h.len, h.w * k);
      ctx.strokeStyle = h.color + "aa"; ctx.lineWidth = 2; ctx.strokeRect(0, -h.w / 2, h.len, h.w);
    } else if(h.k === "p"){
      const act = h.t >= h.delay;
      ctx.fillStyle = h.color + (act ? "44" : "18"); ctx.strokeStyle = h.color; ctx.lineWidth = 2; ctx.setLineDash(act ? [] : [6, 6]);
      ctx.beginPath(); ctx.arc(h.x, h.y, h.r * (act ? 1 + Math.sin(time * 6) * 0.04 : 1), 0, 6.283); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }
  for(const f of G.fires){
    const k = f.t / f.life; ctx.save(); ctx.globalAlpha = 0.85 * (1 - k * 0.5);
    const fg = ctx.createRadialGradient(f.x, f.y, 4, f.x, f.y, f.r); fg.addColorStop(0, f.color + "88"); fg.addColorStop(1, f.color + "10");
    ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283); ctx.fill();
    ctx.strokeStyle = f.color; ctx.lineWidth = 2; ctx.setLineDash([8, 8]); ctx.beginPath(); ctx.arc(f.x, f.y, f.r, time, time + 6.283); ctx.stroke(); ctx.restore();
  }
  for(const gh of G.ghosts){ ctx.save(); ctx.globalAlpha = Math.max(0, gh.life / 0.32) * 0.5; ctx.fillStyle = gh.color; ctx.shadowColor = gh.color; ctx.shadowBlur = 12; ctx.beginPath(); ctx.arc(gh.x, gh.y, 16, 0, 6.283); ctx.fill(); ctx.restore(); }
  for(const o of G.orbiters){ ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.ang * 2); ctx.shadowColor = o.color; ctx.shadowBlur = 14; ctx.fillStyle = o.color; ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(0, 6); ctx.lineTo(-10, 0); ctx.lineTo(0, -6); ctx.closePath(); ctx.fill(); ctx.fillStyle = "#fff"; ctx.fillRect(-2, -1.5, 14, 3); ctx.restore(); }
  for(const pe of G.pets){ ctx.save(); ctx.shadowColor = pe.color; ctx.shadowBlur = 14; ctx.fillStyle = "#0b0e1acc"; ctx.strokeStyle = pe.color; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(pe.x, pe.y + Math.sin(time * 5 + pe.k) * 3, 14, 0, 6.283); ctx.fill(); ctx.stroke(); ctx.font = "16px system-ui"; ctx.textAlign = "center"; ctx.fillText(pe.icon, pe.x, pe.y + 6 + Math.sin(time * 5 + pe.k) * 3); ctx.restore(); }
  for(const z of obj.zones){
    ctx.save();
    const inside = Math.hypot(p.x - z.x, p.y - z.y) <= z.r + p.r;
    ctx.fillStyle = inside ? "#4be89c33" : A + "22"; ctx.strokeStyle = inside ? "#4be89c" : A; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, 6.283); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = "#ffd166"; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(z.x, z.y, z.r + 9, -Math.PI / 2, -Math.PI / 2 + 6.283 * obj.progress / obj.target); ctx.stroke();
    ctx.save(); ctx.translate(z.x, z.y); ctx.rotate(time * 0.7); ctx.setLineDash([8, 10]); ctx.strokeStyle = A + "88"; ctx.beginPath(); ctx.arc(0, 0, z.r * 0.6, 0, 6.283); ctx.stroke(); ctx.restore();
    ctx.restore();
  }
  for(const it of obj.items){
    if(it.got) continue;
    const by = Math.sin(time * 3 + it.x) * 4;
    ctx.save(); ctx.translate(it.x, it.y + by); ctx.shadowColor = "#7ce0ff"; ctx.shadowBlur = 16;
    ctx.fillStyle = "#7ce0ff"; ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(12, 0); ctx.lineTo(0, 16); ctx.lineTo(-12, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.rotate(time * 2); ctx.strokeStyle = "#7ce0ff99"; ctx.strokeRect(-20, -20, 40, 40); ctx.restore();
  }
  for(const d of G.drops){
    const by = Math.sin(time * 3 + d.ph) * 3.5;
    ctx.save(); ctx.translate(d.x, d.y + by);
    ctx.shadowColor = d.rare ? "#ffd166" : "#8ea2ff"; ctx.shadowBlur = 14;
    const gr = ctx.createLinearGradient(-d.r, -d.r, d.r, d.r); gr.addColorStop(0, d.rare ? "#fff3b0" : "#d7deff"); gr.addColorStop(1, d.rare ? "#ff9f1a" : "#5b6fe8");
    ctx.fillStyle = gr; ctx.strokeStyle = "#ffffffcc"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, -d.r * 1.3); ctx.lineTo(d.r * 0.9, -d.r * 0.2); ctx.lineTo(d.r * 0.6, d.r); ctx.lineTo(-d.r * 0.6, d.r); ctx.lineTo(-d.r * 0.9, -d.r * 0.2); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = "#ffffff99"; ctx.beginPath(); ctx.moveTo(0, -d.r * 1.3); ctx.lineTo(0, d.r); ctx.stroke();
    ctx.restore();
  }
  for(const hl of G.holes){
    ctx.save(); ctx.translate(hl.x, hl.y);
    const k = Math.min(1, hl.t / hl.life);
    ctx.strokeStyle = "#b580ff88"; ctx.lineWidth = 3; ctx.setLineDash([10, 8]); ctx.beginPath(); ctx.arc(0, 0, hl.r * (1 - k * 0.2), 0, 6.283); ctx.stroke(); ctx.setLineDash([]);
    const g = ctx.createRadialGradient(0, 0, 4, 0, 0, 70); g.addColorStop(0, "#000"); g.addColorStop(0.55, "#2a0a4d"); g.addColorStop(1, "#b580ff00");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 70 + k * 18, 0, 6.283); ctx.fill();
    ctx.rotate(time * 5); ctx.strokeStyle = "#ff6bd6"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 40, 0, 4.2); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, 26, 2, 5.5); ctx.stroke();
    ctx.restore();
  }
  for(const s of G.sats){
    ctx.save(); ctx.shadowColor = "#ffbe3b"; ctx.shadowBlur = 14; ctx.fillStyle = "#fff3b0"; ctx.beginPath(); ctx.arc(s.x, s.y, 7, 0, 6.283); ctx.fill();
    ctx.strokeStyle = "#ff6b3d"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(s.x, s.y, 11, 0, 6.283); ctx.stroke(); ctx.restore();
  }
  if(p.id === "ff" && effStar("ff") >= 8){
    ctx.save(); ctx.translate(p.x, p.y);
    const ag = ctx.createRadialGradient(0, 0, 30, 0, 0, 185); ag.addColorStop(0, "#ff6b3d00"); ag.addColorStop(0.8, "#ff6b3d22"); ag.addColorStop(1, "#ff4df055");
    ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(0, 0, 185, 0, 6.283); ctx.fill();
    ctx.rotate(time * 1.2); ctx.strokeStyle = "#ff4df0aa"; ctx.lineWidth = 2; ctx.setLineDash([14, 10]); ctx.beginPath(); ctx.arc(0, 0, 182, 0, 6.283); ctx.stroke(); ctx.restore();
    for(let k = 0; k < 2; k++){
      const aa = G.time * 3 + k * Math.PI;
      ctx.save(); ctx.globalAlpha = 0.75; ctx.shadowColor = "#ff6b3d"; ctx.shadowBlur = 14; ctx.fillStyle = "#ffbe3b"; ctx.beginPath(); ctx.arc(p.x + Math.cos(aa) * 50, p.y + Math.sin(aa) * 50, 9, 0, 6.283); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(p.x + Math.cos(aa) * 50, p.y + Math.sin(aa) * 50, 4, 0, 6.283); ctx.fill(); ctx.restore();
    }
  }
  for(const s of elationSlots()){
    const col = EL_COLORS[ch(s.id)[2]] || "#ff9ff3";
    ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = 12; ctx.fillStyle = "#0b0e1acc"; ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(s.x, s.y, 12, 0, 6.283); ctx.fill(); ctx.stroke();
    ctx.font = "13px system-ui"; ctx.textAlign = "center"; ctx.fillText(ch(s.id)[8] || "🎭", s.x, s.y + 5); ctx.restore();
  }
}

function drawOverlays(ctx, vw, vh){
  if(!G) return;
  const A = G.map.accent;
  if(G.cutin){ drawCutin(ctx, vw, vh); return; }
  const bossE = G.enemies.find(en => en.boss && en.hp > 0);
  if(bossE && !G.clearing){
    const bw = Math.min(560, vw * 0.55), bx = vw / 2 - bw / 2, by = 64;
    ctx.save(); ctx.textAlign = "center";
    ctx.fillStyle = "#000000b0"; ctx.fillRect(bx - 4, by - 22, bw + 8, 38);
    ctx.fillStyle = "#fff"; ctx.font = "bold 13px system-ui"; ctx.fillText(`👹 ${bossE.name}${bossE.enraged ? "  —  ENRAGED" : ""}`, vw / 2, by - 6);
    ctx.fillStyle = "#331018"; ctx.fillRect(bx, by, bw, 9);
    ctx.fillStyle = bossE.enraged ? "#ff3b5c" : (bossE.color || "#ff5a6e"); ctx.fillRect(bx, by, bw * Math.max(0, bossE.hp / bossE.maxHp), 9);
    ctx.fillStyle = "#facc15"; ctx.fillRect(bx, by + 11, bw * Math.max(0, bossE.toughness / bossE.maxToughness), 3);
    ctx.restore();
  }
  const slats = (cover) => {
    const n = 9, sw = vw / n;
    for(let i = 0; i < n; i++){
      const lp = Math.max(0, Math.min(1, cover * 1.5 - i * 0.07));
      ctx.fillStyle = i % 2 ? A + "44" : "#ffd16644";
      ctx.beginPath(); const x = i * sw; ctx.moveTo(x + 60, 0); ctx.lineTo(x + 60 + sw * lp, 0); ctx.lineTo(x + sw * lp, vh); ctx.lineTo(x, vh); ctx.closePath(); ctx.fill();
    }
  };
  if(G.clearing){
    const c = G.clearing, t = Math.min(1, c.t / c.dur);
    const cover = Math.min(1, t / 0.25) * (t > 0.8 ? Math.max(0, 1 - (t - 0.8) / 0.2) : 1);
    ctx.save();
    ctx.fillStyle = `rgba(4,6,16,${0.88 * cover})`; ctx.fillRect(0, 0, vw, vh);
    slats(cover);
    if(cover > 0.55){
      const a = Math.min(1, (cover - 0.55) / 0.45), pop = 1 + Math.max(0, 1 - (t - 0.2) / 0.2) * 0.35;
      ctx.globalAlpha = a; ctx.textAlign = "center";
      ctx.save(); ctx.translate(vw / 2, vh / 2 - 30); ctx.scale(pop, pop);
      ctx.shadowColor = "#ffd166"; ctx.shadowBlur = 24; ctx.fillStyle = "#ffd166"; ctx.font = "900 44px system-ui"; ctx.fillText(`STAGE ${c.from} CLEARED`, 0, 0); ctx.restore();
      ctx.fillStyle = "#4be89c"; ctx.font = "bold 20px system-ui"; ctx.fillText(`+${c.bonus} ✦ Stellar Jade`, vw / 2, vh / 2 + 10);
      ctx.fillStyle = "#c9d3ff"; ctx.font = "600 15px system-ui"; ctx.fillText(`Next: Stage ${c.from + 1} · ${c.nextName}`, vw / 2, vh / 2 + 44);
      ctx.fillStyle = "#8f9bd6"; ctx.font = "13px system-ui"; ctx.fillText(c.nextObj, vw / 2, vh / 2 + 66);
      ctx.fillStyle = "#ffd166"; ctx.fillRect(vw / 2 - 120, vh / 2 + 82, 240 * t, 3);
    }
    ctx.restore();
  } else if(G.intro){
    const t = G.intro.t / G.intro.dur;
    const cover = Math.max(0, 1 - t / 0.5);
    ctx.save();
    ctx.fillStyle = `rgba(4,6,16,${0.88 * cover})`; ctx.fillRect(0, 0, vw, vh);
    slats(cover);
    const a = t < 0.15 ? t / 0.15 : Math.max(0, 1 - (t - 0.55) / 0.45);
    if(a > 0){
      ctx.globalAlpha = a; ctx.textAlign = "center";
      ctx.shadowColor = A; ctx.shadowBlur = 20; ctx.fillStyle = "#fff"; ctx.font = "900 40px system-ui"; ctx.fillText(`STAGE ${S.stage}`, vw / 2, vh / 2 - 8);
      ctx.shadowBlur = 0; ctx.fillStyle = A; ctx.font = "bold 16px system-ui"; ctx.fillText(G.map.name, vw / 2, vh / 2 + 22);
      ctx.fillStyle = "#c9d3ff"; ctx.font = "13px system-ui"; ctx.fillText(`${G.objective.title} · ${G.map.layoutName}`, vw / 2, vh / 2 + 46);
    }
    ctx.restore();
  }
  if(G.defeated){
    const k = Math.min(1, (G.defeatT || 0) / 1.2);
    ctx.save(); ctx.fillStyle = `rgba(120,0,20,${0.5 * k})`; ctx.fillRect(0, 0, vw, vh);
    ctx.globalAlpha = k; ctx.textAlign = "center"; ctx.fillStyle = "#ff5a6e"; ctx.shadowColor = "#ff0033"; ctx.shadowBlur = 24; ctx.font = "900 54px system-ui"; ctx.fillText("DEFEAT", vw / 2, vh / 2 - 90);
    ctx.restore();
  }
}

  if(objEl){
    if(obj.type === "exterminate") objEl.textContent = `${G.enemies.length} enemies left`;
    else if(obj.type === "beacon") objEl.textContent = `${Math.floor(obj.progress)}% Charged`;
    else if(obj.type === "cores") objEl.textContent = `${obj.progress}/${obj.target} Nodes`;
    else if(obj.type === "survive") objEl.textContent = `${Math.max(0, obj.target - obj.progress).toFixed(1)}s left`;
    else if(obj.type === "collect") objEl.textContent = `Shards ${obj.progress}/${obj.target}`;
    else if(obj.type === "waves") objEl.textContent = `Wave ${Math.min(obj.target, obj.progress + 1)}/${obj.target} · ${G.enemies.length} foes`;
    else if(obj.type === "elites") objEl.textContent = `${obj.target - obj.progress} Elites left`;
    else if(obj.type === "miniboss") objEl.textContent = obj.progress >= 1 ? "Captain slain" : "Slay the Captain";
    else if(obj.type === "zones") objEl.textContent = `Zones ${Math.round(obj.progress)}%`;
  }
  if(ultBtn){
    const st = effStar(p.id);
    if(st >= 6){
      ultBtn.style.display = "inline-block";
      if(p.id === "ff" && p.samTimer > 0){
        ultBtn.textContent = `🤖 SAM Active (${p.samTimer.toFixed(1)}s)`;
        ultBtn.className = "on";
      } else if(p.ultCharge >= p.ultMaxCharge){
        ultBtn.textContent = `⚡ ${ch(p.id)[1]} ULT (Q) READY!`;
        ultBtn.className = "ult-ready";
      } else {
        ultBtn.textContent = `⚡ Ult Charge: ${Math.floor(p.ultCharge)}%`;
        ultBtn.className = "alt";
      }
    } else {
      ultBtn.style.display = "none";
    }
  }
}

function battleLoop(ts){
  if(tab !== "b" || !battleActive){ stopBattleLoop(); return; }
  if(!lastFrame) lastFrame = ts;
  const dt = Math.min(0.05, (ts - lastFrame) / 1000);
  lastFrame = ts;
  updateArena(dt);
  drawArena();
  rafId = requestAnimationFrame(battleLoop);
}

function updateCharBars(){
  if(!G || !G.teamHp) return;
  document.querySelectorAll("#char-strip .char-chip").forEach(btn => {
    const id = btn.dataset.id, t = G.teamHp[id];
    if(!t) return;
    const isA = id === G.player.id;
    const hp = isA ? G.player.hp : t.hp, mx = isA ? G.player.maxHp : t.max, sh = isA ? G.player.shield : (t.shield || 0);
    const pct = Math.max(0, Math.min(100, hp / mx * 100));
    const f = btn.querySelector(".hpfill");
    f.style.width = pct + "%";
    f.style.background = pct > 50 ? "#4be89c" : pct > 25 ? "#ffd166" : "#ff5a6e";
    btn.querySelector(".shfill").style.width = Math.min(100, sh / mx * 100) + "%";
    btn.querySelector(".hptxt").textContent = hp <= 0 ? "FALLEN" : `${Math.ceil(hp)} / ${mx}` + (sh > 0 ? ` · 🛡${Math.ceil(sh)}` : "");
    btn.classList.toggle("fallen", hp <= 0);
  });
}

function renderStagePreviewCanvas(){
  const pCanvas = $("#stage-preview-canvas");
  if(!pCanvas) return;
  const pCtx = pCanvas.getContext("2d");
  const pw = pCanvas.width, ph = pCanvas.height;
  const map = getMapForStage(S.stage);
  const scaleX = pw / WORLD_W, scaleY = ph / WORLD_H;
  drawStageEnvironment(pCtx, pw, ph, map, performance.now() * 0.001);
  if(map.obstacles){
    pCtx.save();
    pCtx.fillStyle = map.accent + "66";
    pCtx.strokeStyle = map.accent;
    pCtx.lineWidth = 1.5;
    for(const ob of map.obstacles){
      pCtx.beginPath();
      pCtx.roundRect(ob.x * scaleX, ob.y * scaleY, Math.max(6, ob.w * scaleX), Math.max(6, ob.h * scaleY), 4);
      pCtx.fill(); pCtx.stroke();
    }
    pCtx.restore();
  }
  pCtx.save();
  pCtx.fillStyle = "#060812aa";
  pCtx.fillRect(8, 8, pw - 16, 22);
  pCtx.fillStyle = "#eef0ff";
  pCtx.font = "bold 11px system-ui";
  pCtx.textAlign = "left";
  pCtx.fillText(`Stage ${S.stage}: ${map.name} · ${map.layoutName}${S.stage % 10 === 0 ? " · 👹 BOSS STAGE" : ""}`, 14, 23);
  pCtx.restore();
}

function removeBattleScreen(){
  const bf = document.getElementById("bf");
  if(bf) bf.remove();
  document.body.classList.remove("in-battle");
  try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); }catch(e){}
}
function toggleFullscreen(){
  const el = document.documentElement;
  try{
    if(document.fullscreenElement || document.webkitFullscreenElement){ (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
    else {
      const f = el.requestFullscreen || el.webkitRequestFullscreen;
      if(f){ const r = f.call(el); if(r && r.then) r.then(() => { try{ if(IS_MOBILE && screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(()=>{}); }catch(e){} }).catch(()=>{}); }
    }
  }catch(e){}
}
function fitBattleCanvas(){
  const cv = document.getElementById("arena");
  if(!cv) return;
  const iw = window.innerWidth, ih = window.innerHeight, sc = Math.min(1, 1500 / iw);
  cv.width = Math.round(iw * sc); cv.height = Math.round(ih * sc);
  VIEW.w = cv.width; VIEW.h = cv.height;
  if(G){ G.viewW = VIEW.w; G.viewH = VIEW.h; }
}
window.addEventListener("resize", () => { if(battleActive) fitBattleCanvas(); });

    const rect = canvas.getBoundingClientRect();
    G.player.aimX = ((e.clientX - rect.left) / rect.width) * G.viewW + G.camX;
    G.player.aimY = ((e.clientY - rect.top) / rect.height) * G.viewH + G.camY;
  };
  if(!IS_MOBILE){
    canvas.onmousemove = updateAim;

    let dx = (e.clientX - cx) / (r.width / 2), dy = (e.clientY - cy) / (r.height / 2);
    const m = Math.hypot(dx, dy); if(m > 1){ dx /= m; dy /= m; }
    knob.style.left = (35 + dx * 35) + "px"; knob.style.top = (35 + dy * 35) + "px";
    if(G) G.joy = { x: Math.abs(dx) < 0.12 ? 0 : dx, y: Math.abs(dy) < 0.12 ? 0 : dy, active: true };
  };
  joy.onpointerdown = e => { e.preventDefault(); joyId = e.pointerId; joy.setPointerCapture(joyId); joyMove(e); };
  joy.onpointermove = e => { if(e.pointerId === joyId) joyMove(e); };
  const joyEnd = e => { if(e.pointerId !== joyId) return; joyId = null; knob.style.left = "35px"; knob.style.top = "35px"; if(G) G.joy = { x: 0, y: 0, active: false }; };

  lastFrame = 0;
  stopBattleLoop();

}

let rosterQ = "", rosterPath = "all", rosterStar = "all", rosterOwnOnly = false;
function drawRoster(a){
  stopBattleLoop();
  const q = rosterQ.trim().toLowerCase();
  const ids = ROSTER.slice().filter(c => {
    const id = c[0];

    if(rosterPath !== "all" && c[4] !== rosterPath) return false;
    if(rosterStar !== "all" && String(effStar(id)) !== rosterStar) return false;
    if(rosterOwnOnly && !S.own[id]) return false;
    return true;
  }).sort((p,q2)=>effStar(q2[0])-effStar(p[0]) || q2[3]-p[3]).map(c=>c[0]);
  const got = ROSTER.filter(c=>S.own[c[0]]).length;

  const SORTED_RULES = ASCENSION_RULES.slice().sort((p, q) => q.targetStar - p.targetStar);
  const selRule = SORTED_RULES.find(r => r.id === ascSelectedId) || SORTED_RULES[0];

      </div>` : ""}
      ${msg ? `<div class="log">${msg}</div>` : ""}
    </div>
    <div class="panel">
      <b>Active Squad (up to 4)</b> <small>tap owned style to toggle · ${S.team.length}/4</small>

        <input id="roster-search" placeholder="🔍 Search name or path…" value="${rosterQ.replace(/"/g,'&quot;')}" style="flex:2;min-width:160px">
        <select id="flt-path" style="flex:1;min-width:120px;background:var(--bg);color:var(--tx);border:1px solid var(--mu);border-radius:8px;padding:8px">

  if($("#flt-star")) $("#flt-star").onchange = e => { rosterStar = e.target.value; draw(); };
  if($("#flt-own")) $("#flt-own").onchange = e => { rosterOwnOnly = e.target.checked; draw(); };

      const idx = S.team.indexOf(id);

        if(S.team.length > 1){
          S.team.splice(idx, 1);
          if(S.activeIdx >= S.team.length) S.activeIdx = 0;
        }
      } else if(S.team.length < 4){
        S.team.push(id);
      }
      G = null;
      save();
      draw();
    };
  });
}

function draw(){
  $("#jade").textContent = S.admin ? "∞" : S.jade;
  const tabBar = $("#main-tabs");
  if(tabBar) tabBar.style.display = battleActive ? "none" : "flex";

  // Isolate battle menu while combat is active (lock Summon/Styles tabs until Retreat)
  document.querySelectorAll("#main-tabs button").forEach(b => {
    const isSel = b.dataset.t === tab;
    b.className = isSel ? "sel" : "alt";
    b.disabled = battleActive && b.dataset.t !== "b";
  });

  const a = $("#app");
  if(tab === "s") drawSummon(a);
  else if(tab === "b") drawBattle(a);

  if(S.titleDismissed) renderStarterModal();
}

    <div class="row" style="margin:10px 0"><span class="pill">❤ HP ${s.hp}</span><span class="pill">⚔ ATK ${s.atk}</span><span class="pill">Eidolon ${E}/6</span><span class="pill">💠 ${cp} CP</span></div>
    <div class="row" style="margin-bottom:8px">
      <button type="button" id="cm-equip" class="${inTeam ? "danger" : "asc"}">${inTeam ? "Unequip from Squad" : (S.team.length >= 4 ? "Squad is full (4/4)" : "Equip to Squad")}</button>
      ${unlockedAsc ? `<button type="button" id="cm-form" class="alt">${form === "asc" ? `⬇ Switch to Base Form (${c[3]}★)` : `⬆ Switch to Ascended Form (${ascStar === 1 ? 1 : ascStar}★)`}</button>` : ""}
    </div>
    ${unlockedAsc ? `<div class="mu" style="font-size:11.5px;margin-bottom:6px">Ascension unlocked — switching forms is free. Your character moves between the ${form === "asc" ? ascStar : c[3]}★ and ${form === "asc" ? c[3] : ascStar}★ gacha pools. Eidolons are kept in both forms.</div>` : ""}
    <h4 style="margin:10px 0 4px;color:#ffd166">Eidolon Upgrades</h4>
    <div class="mu" style="font-size:11.5px;margin-bottom:6px">Pull duplicates of this style to earn Character Points (+${CP_GAIN[baseStarOf(id)] || 1} per copy).</div>
    ${eidRows}
  </div></div>`;
  $("#cm-close").onclick = () => { root.innerHTML = ""; draw(); };
  $("#cm-equip").onclick = () => { if(!inTeam && S.team.length >= 4) return; toggleTeam(id); draw(); openCharMenu(id); };
  const fb = $("#cm-form"); if(fb) fb.onclick = () => { S.form[id] = form === "asc" ? "base" : "asc"; G = null; save(); draw(); openCharMenu(id); };
  const eb = root.querySelector(".eid-buy"); if(eb) eb.onclick = () => { if(cp >= cost){ S.cp[id] -= cost; S.eidolon[id] = E + 1; G = null; save(); draw(); openCharMenu(id); } };
}

function resetAllProgress(){
  removeBattleScreen();
  const root = $("#modal-root");
  root.innerHTML = `
    <div class="modal-backdrop">
      <div class="modal-card" style="max-width:440px">
        <h3 style="margin:0 0 8px">Wipe ALL progress?</h3>
        <p class="mu" style="font-size:13px;margin:0 0 16px">This permanently deletes your characters, Stellar Jade, ascensions, stage progress and redeemed codes, then returns you to the starting screen. This cannot be undone.</p>
        <div class="row" style="justify-content:center">
          <button type="button" id="cancel-reset" class="alt">Keep Playing</button>
          <button type="button" id="confirm-reset" class="danger">Yes, Wipe Everything</button>
        </div>
      </div>
    </div>`;
  $("#cancel-reset").onclick = () => { root.innerHTML = ""; renderStarterModal(); };
  $("#confirm-reset").onclick = () => {
    stopBattleLoop();
    battleActive = false; G = null;
    try{ localStorage.removeItem("srs_v6"); }catch(e){}
    location.reload();
  };
}
if($("#btn-reset")) $("#btn-reset").onclick = resetAllProgress;

draw();
</script>
</body>
</html>
